<title>💼 営業のお隣 ｜ オリーブオイル・ストーリーズ</title>
<style>
  :root{
    --kami:#f7f5ef; --sumi:#2b2a26; --usu:#8a8377;
    --waku:#e3ded2; --ao:#0c447c; --usuao:#e8eef7;
  }
  *{box-sizing:border-box}
  body{
    margin:0; background:var(--kami); color:var(--sumi);
    font-family:"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,system-ui,sans-serif;
    -webkit-text-size-adjust:100%;
  }
  .tsutsumi{max-width:760px; margin:0 auto; padding:28px 16px 60px}
  h1{font-size:22px; margin:0 0 4px; letter-spacing:.04em}
  .soe{color:var(--usu); font-size:13px; margin:0 0 22px}
  .modoru{
    display:inline-block; margin-bottom:22px; padding:8px 16px;
    background:#fff; border:1px solid var(--waku); border-radius:999px;
    color:var(--ao); text-decoration:none; font-size:13px; font-weight:700;
  }
  .modoru:hover{background:var(--usuao)}
  .heya{display:grid; gap:12px}
  .to{
    display:flex; align-items:center; gap:14px;
    background:#fff; border:1px solid var(--waku); border-radius:14px;
    padding:18px 18px; text-decoration:none; color:var(--sumi);
    box-shadow:0 1px 2px rgba(0,0,0,.03);
  }
  .to:hover{border-color:var(--ao); background:var(--usuao)}
  .e{font-size:26px; line-height:1}
  .na{font-weight:700; font-size:16px}
  .setsu{color:var(--usu); font-size:12px; margin-top:3px}
  .fuda{
    margin-left:auto; font-size:11px; color:var(--usu);
    border:1px solid var(--waku); border-radius:6px; padding:2px 7px;
  }
  .memo{
    margin-top:26px; padding:14px 16px; border-radius:12px;
    background:#fff; border:1px dashed var(--waku);
    color:var(--usu); font-size:12px; line-height:1.8;
  }
</style>
</head>
<body>
<div class="tsutsumi">
