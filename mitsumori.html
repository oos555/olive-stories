<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- ══════════════════════════════════════════════════════════════════════
     📑 価格リスト・見積M（もとの「見積・請求書 M」）★2026-09-25 作り直し
     ──────────────────────────────────────────────────────────────────
     承認モック：mocks/mock_請求書のみ・書類の発行記録・価格リスト見積M_2026-09-25.html（第3版・ひろみさん「OK」）
     ひろみさん：「これができるなら、見積・請求Ｍアプリは、価格リスト・見積Ｍに変更し、専門性が出せる」
     　・請求書は受注Ａの「発送不要（請求書のみ）」で作ります（ここでは作りません）
     　・上：価格リスト①〜⑧のリンクの置き場（中身のスプシはあとで作る・ひろみさん「価格リストの内容は後にして」）
     　・下：🎁 サンプル発送先リスト（受注Ａのサンプル注文から自動で1行・書くのはひろみさん）
     　・データの置き場所：本部管理専用ゆかスプシのタブ「📑 価格リストのリンク」「🎁 サンプル発送先」
     ★名前・並びはひろみさんの文のとおり（④は「CG大阪」・②と⑦は分ける・⑧弊社の全部）。並べ替えない。
     ★追いかけの日は玄関のアラートに出しません（Q11）。この画面で日付の近い順に並べるだけ。

     ★前の中身（2026-09-14 まで・587,982文字）は控えてあります：
       _backup/2026-09-14_やめたアプリ/mitsumori_全部_2026-09-14.html（git の履歴からも戻せます）
     ★価格リストの中身（金額）を作るときに、tests/ の「★2026-09-14 見積Мはまっさらにしました」の
       見張りを戻すこと（消費税の親 oos-zei.js／単価の親 oos-kakaku.js／区分は日本語で見分ける）。
       いまのこの画面は金額を1つも扱わないので、まだ戻していません。
     ★この2行と oos-version.js / version.json は消さないでください。
     ══════════════════════════════════════════════════════════════════════ -->
<meta name="oos-version" content="2026-09-25-03">
<script src="oos-version.js"></script>
<title>オリーブオイル・ストーリーズ 価格リスト・見積</title>
<style>
  :root{ --kami:#faf9f5; --sumi:#2b2a26; --usu:#8a8578; --waku:#e3e0d6; --midori:#4a5a2a; --ao:#2563eb; }
  *{box-sizing:border-box}
  body{margin:0;background:var(--kami);color:var(--sumi);font-size:14px;line-height:1.7;
    font-family:"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,system-ui,sans-serif;}
  .tsutsumi{max-width:900px;margin:0 auto;padding:22px 16px 60px}
  h1{font-size:21px;margin:0 0 14px}
  h2{font-size:16px;margin:26px 0 10px;padding:8px 0 0;border-top:2px solid var(--waku);color:var(--midori)}
  .modoru{display:inline-block;margin-bottom:16px;padding:8px 16px;background:#fff;border:1px solid var(--waku);
    border-radius:999px;color:#0c447c;text-decoration:none;font-size:13px;font-weight:700}
  .card{background:#fff;border:1px solid var(--waku);border-radius:12px;padding:14px 16px;margin:0 0 14px}
  .grp{font-weight:800;font-size:13px;color:#6b6a63;margin:10px 0 5px}
  .slot{display:flex;gap:10px;align-items:center;border:1px solid var(--waku);border-radius:9px;padding:8px 11px;margin:0 0 6px;background:#fff;flex-wrap:wrap}
  .slot .no{font-weight:800;color:var(--midori);width:22px}
  .slot .nm{font-weight:800;flex:1;min-width:210px}
  .slot .ln{color:var(--ao);font-weight:700;font-size:12.5px;text-decoration:none;cursor:pointer;background:none;border:none;padding:0;font-family:inherit}
  .slot .dt{font-size:11.5px;color:var(--usu)}
  .slot .naosu{font-size:11.5px;color:var(--usu);cursor:pointer;background:none;border:none;padding:0}
  .small{font-size:12px;color:var(--usu);margin:3px 0 10px;line-height:1.6}
  .good{background:#eef7ef;border:1.5px solid #6aa383;border-radius:10px;padding:10px 12px;font-size:13px;color:#0f5a4a;margin:0 0 10px}
  .sample{border:1px solid var(--waku);border-radius:11px;background:#fff;padding:11px 13px;margin:0 0 10px}
  .sample .top{display:flex;justify-content:space-between;flex-wrap:wrap;gap:6px;font-weight:800;margin-bottom:4px}
  .st{display:inline-block;border-radius:999px;padding:1px 10px;font-size:11.5px;font-weight:800;background:#eee;color:#555}
  .st.a{background:#fef3c7;color:#92400e}.st.b{background:#dbeafe;color:#1e40af}.st.c{background:#dcfce7;color:#166534}
  .kv{display:grid;grid-template-columns:100px 1fr;gap:4px 8px;font-size:13px;align-items:center}
  .kv .k{color:var(--usu)}
  .kv input,.kv select{font:inherit;font-size:13px;padding:5px 7px;border:1.5px solid #d5cfc3;border-radius:7px;background:#fff;max-width:100%}
  .kv input[type=text]{width:100%}
  .jidou{color:#0f5a4a;font-size:12px}
  .memo{width:100%;border:1.5px dashed #c9c3b5;border-radius:8px;padding:8px 10px;min-height:60px;font:inherit;font-size:13px;color:#4a463d;background:#fdfcf9;margin-top:6px;resize:vertical}
  .btn{display:inline-block;background:var(--ao);color:#fff;border:none;border-radius:9px;padding:8px 14px;font-weight:800;font-size:13.5px;cursor:pointer;font-family:inherit}
  .btn.w{background:#fff;color:#1f4a6d;border:2px solid var(--ao)}
  .btn:disabled{background:#d6d3cd;color:#8a8578;cursor:not-allowed}
  .kekka{font-size:12.5px;font-weight:700;margin-left:8px}
  .yomikomi{color:var(--usu);font-size:13px;padding:8px 2px}
  @media (max-width:560px){ .kv{grid-template-columns:1fr} }
</style>
</head>
<body>
<div class="tsutsumi">

  <a class="modoru" href="home.html">← 玄関にもどる</a>

  <h1>📑 価格リスト・見積M</h1>

  <div class="card">
    <div id="kakaku-waku"><div class="yomikomi">⏳ 価格リストのリンクを読み込み中です…</div></div>
    <p class="small">②（定価の中）と⑦（卸の中）は別のリスト・別の金額。②が⑦より高くなることがあります。</p>
  </div>

  <h2>🎁 サンプル発送先リスト</h2>
  <div class="good">受注Ａで種別を<b>無料サンプル／有償サンプル</b>にして登録した注文は、<b>自動で1行</b>入ります（送った日・相手・何を・有償／無償・伝票番号）。<br>書くのは、<b>目的・渡した見積・次の追いかけ・状況・自由メモ</b>だけ。</div>
  <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px">
    <button class="btn w" onclick="teTasuHiraku()">＋手で1行たす</button>
    <a class="btn w" id="sample-sps" href="#" target="_blank" rel="noopener" style="text-decoration:none;display:none">📄 スプシで見る</a>
  </div>
  <div id="te-tasu"></div>
  <div id="sample-waku"><div class="yomikomi">⏳ サンプル発送先を読み込み中です…</div></div>
  <p class="small">並びは<b>次の追いかけの日が近い順</b>（日が入っていないものは下）。玄関のアラートには出しません。</p>

</div>
<script>
var GAS_URL = 'https://script.google.com/macros/s/AKfycbwRNgyNZ3HjU7nPSpxCn7uUiMu3MY6ZijEsCtB7Toj_7x9Fu1v5VFyMDLheNZAON4OV/exec';
var JOKYO = ['送った','反応待ち','商談中','成約','見送り'];
var JOKYO_IRO = { '送った':'a', '反応待ち':'b', '商談中':'b', '成約':'c', '見送り':'' };
var KAKAKU = [];      /* ①〜⑧ */
var SAMPLES = [];

function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function md(s){ var m = String(s || '').match(/^\d{4}-(\d{2})-(\d{2})/); return m ? (+m[1]) + '/' + (+m[2]) : ''; }
function ymd(s){ var m = String(s || '').match(/^(\d{4})-(\d{2})-(\d{2})/); return m ? m[1] + '/' + m[2] + '/' + m[3] : String(s || ''); }

async function gasGet(action){
  var r = await fetch(GAS_URL + '?action=' + encodeURIComponent(action) + '&t=' + Date.now());
  return r.json();
}
async function gasPost(body){
  var r = await fetch(GAS_URL, { method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body: JSON.stringify(body) });
  return r.json();
}

/* ── 📑 価格リスト①〜⑧ ── */
async function kakakuYomu(){
  var w = document.getElementById('kakaku-waku');
  try{
    var d = await gasGet('oosKakakuLinkList');
    if(!d || d.status !== 'ok') throw new Error((d && d.message) || '読めませんでした');
    KAKAKU = d.rows || [];
    kakakuKaku();
  }catch(e){
    w.innerHTML = '<div class="yomikomi" style="color:#b91c1c">⚠ 価格リストのリンクを読み込めませんでした（' + esc(e.message || e) + '）。🔄 画面を開き直してください。</div>';
  }
}
function kakakuKaku(){
  var by = {}; KAKAKU.forEach(function(r){ by[r.no] = r; });
  var slot = function(no){
    var r = by[no] || { no:no, namae:'', link:'' };
    var ln = r.link
      ? '<a class="ln" href="' + esc(r.link) + '" target="_blank" rel="noopener">🔗 スプシを開く</a> <button class="naosu" title="リンクを貼りなおす" onclick="kakakuHaru(\'' + no + '\')">✏️</button>'
      : '<button class="ln" onclick="kakakuHaru(\'' + no + '\')">🔗 リンクを貼る</button>';
    var dt = r.koushin ? '更新 ' + md(r.koushin) + (r.kigen ? '・有効 ' + md(r.kigen) + 'まで' : '') : '更新 —';
    return '<div class="slot"><span class="no">' + esc(no) + '</span><span class="nm">' + esc(r.namae) + '</span>' + ln + '<span class="dt">' + dt + '</span></div>';
  };
  document.getElementById('kakaku-waku').innerHTML =
      '<div class="grp">定価</div>' + slot('①') + slot('②')
    + '<div class="grp">卸</div>' + slot('③') + slot('④') + slot('⑤') + slot('⑥') + slot('⑦')
    + '<div class="grp">全部</div>' + slot('⑧');
}
async function kakakuHaru(no){
  var r = KAKAKU.find(function(x){ return x.no === no; }) || {};
  var url = prompt(no + ' ' + (r.namae || '') + '\n\nスプレッドシートのリンク（https:// で始まるもの）を貼ってください。\n空にすると、リンクを外します。', r.link || '');
  if(url === null) return;
  try{
    var d = await gasPost({ action:'oosKakakuLinkSave', no:no, url:String(url).trim() });
    if(!d || d.status !== 'ok') throw new Error((d && d.message) || '保存できませんでした');
    await kakakuYomu();
  }catch(e){ alert('⚠ 保存できませんでした：' + (e.message || e)); }
}

/* ── 🎁 サンプル発送先 ── */
async function sampleYomu(){
  var w = document.getElementById('sample-waku');
  try{
    var d = await gasGet('oosSampleList');
    if(!d || d.status !== 'ok') throw new Error((d && d.message) || '読めませんでした');
    SAMPLES = d.rows || [];
    if(d.sheetUrl){ var a = document.getElementById('sample-sps'); a.href = d.sheetUrl; a.style.display = ''; }
    sampleKaku();
  }catch(e){
    w.innerHTML = '<div class="yomikomi" style="color:#b91c1c">⚠ サンプル発送先を読み込めませんでした（' + esc(e.message || e) + '）。🔄 画面を開き直してください。</div>';
  }
}
function mitsumoriOpts(cur){
  var h = '<option value="">（まだ）</option>';
  KAKAKU.forEach(function(r){ var v = r.no + ' ' + r.namae; h += '<option value="' + esc(v) + '"' + (cur === v ? ' selected' : '') + '>' + esc(v) + '</option>'; });
  if(cur && !KAKAKU.some(function(r){ return (r.no + ' ' + r.namae) === cur; })) h += '<option value="' + esc(cur) + '" selected>' + esc(cur) + '</option>';
  return h;
}
function jokyoOpts(cur){
  return JOKYO.map(function(j){ return '<option' + (cur === j ? ' selected' : '') + '>' + j + '</option>'; }).join('');
}
function sampleKaku(){
  var w = document.getElementById('sample-waku');
  if(!SAMPLES.length){ w.innerHTML = '<div class="yomikomi">まだ1行もありません。受注Ａでサンプルを登録すると、ここに自動で入ります。</div>'; return; }
  var jun = SAMPLES.map(function(r, i){ return { r:r, i:i }; });
  jun.sort(function(a, b){
    var x = a.r.oikakeBi || '', y = b.r.oikakeBi || '';
    if(x && !y) return -1; if(!x && y) return 1;
    if(x !== y) return x < y ? -1 : 1;
    return String(b.r.okuttaBi || '').localeCompare(String(a.r.okuttaBi || ''));
  });
  w.innerHTML = jun.map(function(q){ return sampleCard(q.r, q.i); }).join('');
}
function sampleCard(r, i){
  var te = !r.id || String(r.id).charAt(0) === 'M';   /* 手で足した行（自動の行は送った日などを直せない） */
  var jd = ' <span class="jidou">（自動）</span>';
  var f = function(k, v){ return te ? '<input type="text" data-k="' + k + '" value="' + esc(v) + '">' : esc(v) + jd; };
  return '<div class="sample" id="sample-' + i + '">'
    + '<div class="top"><span>' + (te ? '<input type="text" data-k="aite" value="' + esc(r.aite) + '" placeholder="相手（会社・担当者）" style="font:inherit;font-weight:800;padding:4px 7px;border:1.5px solid #d5cfc3;border-radius:7px;min-width:240px">' : esc(r.aite)) + '</span>'
    + '<span class="st ' + (JOKYO_IRO[r.jokyo] || '') + '">' + esc(r.jokyo || '送った') + '</span></div>'
    + '<div class="kv">'
    +   '<span class="k">送った日</span><span>' + (te ? '<input type="date" data-k="okuttaBi" value="' + esc(r.okuttaBi) + '">' : esc(ymd(r.okuttaBi)) + jd) + '</span>'
    +   '<span class="k">何を</span><span>' + f('nani', r.nani) + '</span>'
    +   '<span class="k">有償・無償</span><span>' + (te
          ? '<select data-k="yushou">' + ['無償','有償','有償・無償'].map(function(x){ return '<option' + (r.yushou === x ? ' selected' : '') + '>' + x + '</option>'; }).join('') + '</select> <input type="text" data-k="bangou" value="' + esc(r.bangou) + '" placeholder="伝票番号（あれば）" style="width:180px">'
          : esc(r.yushou) + ' <span class="jidou">（自動・' + esc(r.bangou) + '）</span>') + '</span>'
    +   '<span class="k">目的</span><span><input type="text" data-k="mokuteki" value="' + esc(r.mokuteki) + '" placeholder="例：レストランでの採用検討"></span>'
    +   '<span class="k">渡した見積</span><span><select data-k="mitsumori">' + mitsumoriOpts(r.mitsumori) + '</select>　<span class="small">（▼①〜⑧から選ぶ）</span></span>'
    +   '<span class="k">次の追いかけ</span><span><input type="date" data-k="oikakeBi" value="' + esc(r.oikakeBi) + '"> <input type="text" data-k="oikake" value="' + esc(r.oikake) + '" placeholder="例：電話で味の感想を聞く" style="width:calc(100% - 160px);min-width:180px"></span>'
    +   '<span class="k">状況</span><span><select data-k="jokyo">' + jokyoOpts(r.jokyo || '送った') + '</select></span>'
    + '</div>'
    + '<textarea class="memo" data-k="memo" placeholder="📝 自由メモ">' + esc(r.memo) + '</textarea>'
    + '<div style="margin-top:6px"><button class="btn" onclick="sampleHozon(\'' + i + '\', this)">💾 保存</button><span class="kekka" id="sample-kekka-' + i + '"></span></div>'
    + '</div>';
}
function sampleAtsumeru(el, base){
  var o = {}; Object.keys(base || {}).forEach(function(k){ o[k] = base[k]; });
  Array.prototype.forEach.call(el.querySelectorAll('[data-k]'), function(x){ o[x.getAttribute('data-k')] = x.value; });
  return o;
}
async function sampleHozon(i, btn){
  var el = document.getElementById('sample-' + i); if(!el) return;
  var te = (i === 'te');
  var row = sampleAtsumeru(el, te ? {} : SAMPLES[+i]);
  if(te){ row.id = ''; if(!String(row.aite || '').trim()){ alert('相手（会社・担当者）を入れてください。'); return; } }
  var k = document.getElementById('sample-kekka-' + i);
  btn.disabled = true; if(k){ k.style.color = '#8a8578'; k.textContent = '保存しています…'; }
  try{
    var d = await gasPost({ action:'oosSampleSave', row:row });
    if(!d || d.status !== 'ok') throw new Error((d && d.message) || '保存できませんでした');
    /* ★2026-09-25 保存したカードだけを描き直す（全部を描き直すと、ほかのカードの書きかけが消えるため）。
       　並びは、画面を開いたときに「次の追いかけの日が近い順」に並べます */
    if(te){
      row.id = d.id || ''; SAMPLES.push(row);
      document.getElementById('te-tasu').innerHTML = '';
      var w = document.getElementById('sample-waku');
      if(SAMPLES.length === 1) w.innerHTML = '';
      w.insertAdjacentHTML('beforeend', sampleCard(row, SAMPLES.length - 1));
      var kt = document.getElementById('sample-kekka-' + (SAMPLES.length - 1));
      if(kt){ kt.style.color = '#0f5a4a'; kt.textContent = '✅ たしました'; }
      return;
    }
    SAMPLES[+i] = row;
    el.outerHTML = sampleCard(row, +i);
    var k2 = document.getElementById('sample-kekka-' + i);
    if(k2){ k2.style.color = '#0f5a4a'; k2.textContent = '✅ 保存しました'; }
  }catch(e){
    btn.disabled = false;
    if(k){ k.style.color = '#b91c1c'; k.textContent = '⚠ 保存できませんでした：' + (e.message || e) + '（書いた内容は消えていません。もう一度押してください）'; }
  }
}
/* 受注Ａを通さずに手渡ししたサンプルなど */
function teTasuHiraku(){
  var w = document.getElementById('te-tasu');
  if(w.innerHTML){ w.innerHTML = ''; return; }
  w.innerHTML = sampleCard({ id:'', aite:'', okuttaBi:(function(d){ return d.getFullYear() + '-' + ('0'+(d.getMonth()+1)).slice(-2) + '-' + ('0'+d.getDate()).slice(-2); })(new Date()), nani:'', yushou:'無償', bangou:'', jokyo:'送った' }, 'te');
  var b = w.querySelector('.btn'); if(b) b.textContent = '＋この1行をたす';
  var top = w.querySelector('input[data-k=aite]'); if(top) top.focus();
}

(async function(){
  await kakakuYomu();      /* 渡した見積の▼に①〜⑧を出すので、先に読みます */
  await sampleYomu();
})();
</script>
</body>
</html>
