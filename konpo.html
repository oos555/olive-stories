<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>📦 きょうの梱包（倉庫さん用スマホビュー）</title>
<!-- ★版の見張り（先祖返り・古いコピー検知）。この2行と version.json の登録を消さないでください -->
<meta name="oos-version" content="2026-09-03-01">
<script src="oos-version.js"></script>
<!-- ═══════════════════════════════════════════════════════════════
     スマホ梱包ビュー（スプシ一本化・第2弾）2026-09-03
     承認済みモック：mocks/おためし版_ゆかスプシと倉庫ファイル_2026-09-03.html の📱画面
     ・読むのは倉庫ファイルのオーダー表（GASの konpoOrders）
     ・☑と梱包終了は、ゆかちゃんの見える列には書かず【隠し列】に記録（konpoPackSave）
     ・在庫はいっさい触らない。送り状NO.と発送済はオーダー表に記入してもらう
     ・画面は開いたとき一度だけ読む＋🔄ボタン（家のルール）
     ・ボタンは全部青（2026-09-03 ひろみさんの家ルール。それ以外はモックの色のまま）
     ═══════════════════════════════════════════════════════════════ -->
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: "Hiragino Kaku Gothic ProN", "Yu Gothic", Meiryo, sans-serif; background: #f6f7f9; color: #202124; }
  .phone-head { background: #2e7d32; color: #fff; padding: 14px; font-size: 16px; font-weight: bold; position: sticky; top: 0; z-index: 5; display:flex; align-items:center; gap:8px; }
  .phone-head .cnt { margin-left:auto; background: rgba(255,255,255,.25); border-radius: 10px; padding: 2px 12px; font-size: 14px; }
  .reload { border:none; border-radius:8px; background:#0c447c; color:#fff; font-weight:bold; font-size:13px; padding:7px 12px; cursor:pointer; font-family:inherit; }
  .phone-body { padding: 12px; max-width: 560px; margin: 0 auto; }
  .stamp { font-size: 11.5px; color: #5f6368; margin-bottom: 8px; }
  .wait-banner { background: #ffe0b2; border: 1px solid #ffb74d; border-radius: 10px; padding: 9px 12px; font-size: 12.5px; margin-bottom: 10px; line-height: 1.6; }
  .err-banner { background:#fdecea; border:1.5px solid #e57373; color:#b71c1c; border-radius:10px; padding:10px 12px; font-size:13px; margin-bottom:10px; line-height:1.7; display:none; }
  .toast { background:#e8f5e9; border:1.5px solid #7cb342; color:#1b5e20; border-radius:10px; padding:9px 12px; font-size:12.5px; margin-bottom:10px; line-height:1.7; display:none; }
  .empty { font-size: 13.5px; color: #8a8578; padding: 14px 6px; }
  .pack-card { background: #fff; border: 1px solid #dadce0; border-radius: 12px; padding: 12px 14px; margin-bottom: 12px; font-size: 13.5px; line-height: 1.8; }
  .pack-card .name { font-size: 16px; font-weight: bold; }
  .pack-card .date { color: #b71c1c; font-weight: bold; }
  .fixmark { color:#e65100; font-weight:bold; font-size:12px; }
  .pack-note { color: #5f6368; font-size: 12px; }
  .pack-item { background: #f1f8e9; border-radius: 8px; padding: 8px 10px; margin: 5px 0; display: flex; align-items: center; gap: 9px; cursor: pointer; user-select:none; }
  .pack-item .chk { font-size: 22px; flex-shrink: 0; line-height:1; }
  .pack-item.checked { background: #e0e0e0; text-decoration: line-through; color: #757575; }
  .pack-done-btn { display: block; width: 100%; background: #0c447c; color: #fff; border: none; border-radius: 10px; text-align: center; padding: 12px; font-weight: bold; font-size: 14.5px; margin-top: 10px; cursor: pointer; font-family: inherit; }
  .phone-foot { background: #eceff1; padding: 12px 14px; font-size: 12px; color: #546e7a; line-height: 1.7; max-width:560px; margin:0 auto; border-radius:10px 10px 0 0; }
</style>
</head>
<body>

<div class="phone-head">📦 きょうの梱包
  <button class="reload" onclick="loadOrders()">🔄 新しくする</button>
  <span class="cnt" id="cnt">…</span>
</div>

<div class="phone-body">
  <div class="stamp" id="stamp"></div>
  <div class="err-banner" id="err"></div>
  <div class="toast" id="toast"></div>
  <div id="list"><div class="empty">読み込んでいます…</div></div>
</div>

<div class="phone-foot">🔢 数は「本」と「箱」の両方で表示します。✅梱包終了はスマホから消えるだけで、スプシには全部残ります。送り状NO.と発送済は倉庫ファイルのオーダー表に記入してください。</div>

<script>
'use strict';
/* GASの窓口（他のアプリと同じ住所・同じ呼び方） */
const GAS_URL = 'https://script.google.com/macros/s/AKfycbwRNgyNZ3HjU7nPSpxCn7uUiMu3MY6ZijEsCtB7Toj_7x9Fu1v5VFyMDLheNZAON4OV/exec';

let ORDERS = [];
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }
function toast(m){ const t=document.getElementById('toast'); t.innerHTML=m; t.style.display='block'; window.scrollTo({top:0,behavior:'smooth'}); }
function showErr(m){ const el=document.getElementById('err'); el.innerHTML=m; el.style.display='block'; }
async function post(payload){
  const res = await fetch(GAS_URL, { method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body: JSON.stringify(payload) });
  return res.json();
}
function qtyLabel(q){ const s=String(q==null?'':q).trim(); return /^\d+$/.test(s) ? s+'本' : s; }

async function loadOrders(){
  document.getElementById('err').style.display='none';
  document.getElementById('toast').style.display='none';
  document.getElementById('list').innerHTML='<div class="empty">読み込んでいます…</div>';
  try{
    const d = await post({ action:'konpoOrders' });
    if(!d || d.status!=='ok'){ showErr('読み込めませんでした：'+esc((d&&d.message)||'不明なエラー')+'<br>🔄を押して、もう一度お試しください。'); document.getElementById('list').innerHTML=''; return; }
    ORDERS = d.orders||[];
    document.getElementById('stamp').textContent = '🕐 読み込み ' + (d.at||'') + '（最新にしたいときは上の🔄）';
    render();
  }catch(e){
    showErr('通信できませんでした：'+esc(e.message)+'<br>電波のよい場所で🔄を押してください。');
    document.getElementById('list').innerHTML='';
  }
}

function render(){
  const targets = ORDERS.filter(o => !o.wait && !(o.pack && o.pack.packed));
  const waits   = ORDERS.filter(o => o.wait);
  document.getElementById('cnt').textContent = 'のこり ' + targets.length + '件';
  let h = '';
  if(waits.length){
    h += '<div class="wait-banner">✈️ 入荷待ち '+waits.length+'件（'+waits.map(o=>esc(o.name)).join('・')+'）— 入荷したらお知らせが届きます。まだ梱包しません。</div>';
  }
  if(!targets.length){
    h += '<div class="empty">いま梱包する件はありません。</div>';
  }
  targets.forEach(o => {
    const c = (o.pack && o.pack.c) || {};
    h += '<div class="pack-card"><div class="name">'+esc(o.name)+'</div>'
      + (o.fixed ? '<div class="fixmark">'+esc(o.fixed)+'（内容が変わっています）</div>' : '')
      + '<div class="pack-note">🕐 依頼 '+esc(o.requested)+'</div>'
      + '<div class="date">🚚 お届け '+esc(o.day||'指定なし')+(o.time?'（'+esc(o.time)+'）':'')+'</div>';
    o.items.forEach((it, idx) => {
      const on = !!c['i'+idx];
      h += '<div class="pack-item'+(on?' checked':'')+'" onclick="togglePack('+o.row+',\'i'+idx+'\')"><span class="chk">'+(on?'☑':'☐')+'</span><span>'+esc(it.name)+' × '+esc(qtyLabel(it.qty))+'</span></div>';
    });
    const dOn = !!c['doc'];
    h += '<div class="pack-item'+(dOn?' checked':'')+'" onclick="togglePack('+o.row+',\'doc\')"><span class="chk">'+(dOn?'☑':'☐')+'</span><span>📄 納品書を同梱</span></div>'
      + '<div class="pack-note">'+esc(o.addr)+(o.note?' ／ '+esc(o.note):'')+'</div>'
      + '<button class="pack-done-btn" onclick="packDone('+o.row+')">✅ 梱包終了（この1件をスマホから消す）</button></div>';
  });
  document.getElementById('list').innerHTML = h;
}

function findByRow(row){ return ORDERS.find(o => o.row === row); }

async function savePack(o){
  try{
    const d = await post({ action:'konpoPackSave', row:o.row, key:o.key, state:o.pack });
    if(!d || d.status!=='ok') showErr('☑を記録できませんでした：'+esc((d&&d.message)||'不明なエラー')+'（画面はこのまま使えます。あとで🔄で確認してください）');
  }catch(e){ showErr('☑を記録できませんでした（通信エラー）。画面はこのまま使えます。'); }
}

function togglePack(row, key){
  const o = findByRow(row); if(!o) return;
  o.pack = o.pack || {}; o.pack.c = o.pack.c || {};
  o.pack.c[key] = !o.pack.c[key];
  render();
  savePack(o);
}

function packDone(row){
  const o = findByRow(row); if(!o) return;
  o.pack = o.pack || {}; o.pack.packed = true;
  render();
  savePack(o);
  toast('✅ 梱包終了。この1件はスマホから消えました。倉庫ファイルには全部の情報が残っています。あとはオーダー表で送り状NO.→発送済にすれば完了です。');
}

loadOrders();
</script>
</body>
</html>
