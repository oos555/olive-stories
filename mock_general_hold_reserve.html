<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>【動くモック】一般のお客様の取り置き・予約 入力スペース</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Hiragino Sans','Yu Gothic',sans-serif;background:#faf7f2;color:#2b2a26;font-size:14px;line-height:1.5}
.app{max-width:900px;margin:0 auto;padding:1rem 1rem 4rem}
.mockbar{background:#3f3a2e;color:#fff;font-size:12px;padding:8px 13px;border-radius:8px;margin-bottom:12px}
.mockbar b{color:#ffd88a}
.oos-header{background:#a3b18a;color:#33421f;padding:12px 16px;font-size:16px;font-weight:bold;border-radius:12px 12px 0 0;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.oos-sub{background:#fff;border:1px solid #e8e2d8;border-top:none;border-radius:0 0 12px 12px;padding:10px 14px;margin-bottom:14px;font-size:12.5px;color:#5c574c}
.tab-row{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
.tab{padding:7px 14px;border-radius:8px 8px 0 0;background:#efece4;border:1px solid #e2ddce;color:#8a857a;font-size:13px;font-weight:700}
.tab.on{background:#fff;color:#33421f;border-bottom-color:#fff}

.sec2{display:flex;gap:8px;align-items:center;margin:4px 2px 10px}
.sec2 .ic{font-size:16px}.sec2 .t{font-size:15px;font-weight:800;color:#33421f}

.card{background:#fff;border:1px solid #e2ddce;border-radius:12px;padding:14px;margin-bottom:14px}
.formrow{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end}
.fg{display:flex;flex-direction:column;gap:4px}
.fg label{font-size:12px;color:#6b6558;font-weight:700}
.fg select,.fg input{padding:9px 10px;border:1.5px solid #9d957f;border-radius:8px;font-size:15px;background:#fff}
.fg select:focus,.fg input:focus{outline:none;border-color:#6b7a3a}
.fg.cust select{min-width:180px}
.fg.prod select{min-width:190px}
.fg.qty input{width:90px;text-align:right;font-weight:800}
.fg.date input{min-width:150px}
.stockline{font-size:12.5px;margin:8px 2px 2px;color:#5c574c;min-height:20px}
.stockline b{font-size:16px;color:#256b3a}
.stockline .src{font-size:10.5px;color:#a49e90}
.stockwarn{color:#b91c1c;font-weight:700}

.kind{display:flex;gap:8px;margin-top:2px}
.kind label{display:flex;align-items:center;gap:6px;border:1.5px solid #cfc8b8;border-radius:8px;padding:8px 12px;cursor:pointer;font-weight:700;font-size:14px;background:#fff}
.kind input{width:18px;height:18px}
.kind label.held.on{border-color:#d9a441;background:#fff9ef;color:#7a3a0e}
.kind label.res.on{border-color:#85b7eb;background:#eef4fb;color:#0c447c}

.btn-add{background:#55622e;color:#fff;border:none;border-radius:9px;padding:11px 20px;font-size:15px;font-weight:800;cursor:pointer}
.btn-add:hover{background:#48521f}
.addwrap{display:flex;justify-content:flex-end;margin-top:12px}

.listcard{background:#fff;border:1px solid #e2ddce;border-radius:12px;overflow:hidden}
.lc-head{background:#f6f4ee;padding:9px 14px;font-weight:800;font-size:13px;color:#33421f;border-bottom:1px solid #ece7dc}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:8px 12px;text-align:left;border-bottom:1px solid #f1ece0;white-space:nowrap}
th{background:#faf8f2;font-size:11px;color:#5c574c}
td.r,th.r{text-align:right}
.badge{display:inline-block;font-size:11px;font-weight:800;padding:2px 9px;border-radius:99px}
.b-held{background:#fef3c7;color:#7a3a0e}
.b-res{background:#dbeafe;color:#1e3a8a}
.over{color:#b91c1c;font-weight:800}
.soon{color:#b45309;font-weight:800}
.del{border:1px solid #e6b4b4;background:#fff;color:#9a3b3b;border-radius:6px;padding:3px 9px;font-size:12px;font-weight:700;cursor:pointer}
.empty{color:#8a857a;padding:14px;font-size:13px}
.hint{font-size:11.5px;color:#8a857a;margin-top:6px}
.hint b{color:#7a3a0e}
</style>
</head>
<body>
<div class="app">

  <div class="mockbar">🧪 <b>動くモック</b>。一般のお客様の取り置き・予約を<b>1件ずつ手で</b>足せます（大口は分けて入力）。商品を選ぶと販売可能在庫が出ます。実ブラウザで操作を。</div>

  <div class="oos-header">🗄🗓 取り置き・予約</div>
  <div class="oos-sub">受注・出荷A のタブ。ホテルは <b>RT取り置き・予約</b>、<b>一般のお客様はここで1件ずつ</b>。どちらも受注Aの取り置き/予約になり、在庫への効き方は1本。</div>

  <div class="tab-row"><span class="tab">🏛 RT</span><span class="tab on">🏨 一般のお客様</span></div>

  <div class="sec2"><span class="ic">＋</span><span class="t">取り置き・予約を追加（一般のお客様）</span></div>
  <div class="card">
    <div class="formrow">
      <div class="fg cust"><label>お客様</label>
        <select id="f-cust"><option value="">選択…</option></select></div>
      <div class="fg prod"><label>商品</label>
        <select id="f-prod" onchange="onProd()"><option value="">選択…</option></select></div>
      <div class="fg qty"><label>本数</label>
        <input id="f-qty" type="number" min="1" placeholder="0" oninput="onProd()"></div>
    </div>

    <div class="stockline" id="stockline"></div>

    <div class="formrow" style="margin-top:10px">
      <div class="fg"><label>種別</label>
        <div class="kind">
          <label class="held on" id="k-held"><input type="radio" name="kind" value="held" checked onchange="onKind()">🗄 取り置き</label>
          <label class="res" id="k-res"><input type="radio" name="kind" value="reserved" onchange="onKind()">🗓 予約</label>
        </div></div>
      <div class="fg date"><label id="date-lbl">取り置き期限（いつまで）</label>
        <input id="f-date" type="date"></div>
    </div>

    <div class="hint" id="hint">💡 大口で在庫が足りないときは、<b>取り置き（在庫分）</b>を1件足してから、<b>予約（残り）</b>をもう1件足す＝手で分けます。</div>

    <div class="addwrap"><button class="btn-add" onclick="addEntry()">＋ この内容で追加</button></div>
  </div>

  <div class="listcard">
    <div class="lc-head">🏨 一般のお客様の 取り置き・予約 一覧</div>
    <div id="list"></div>
  </div>

</div>

<script>
var TODAY=new Date('2026-08-10');
var CUSTOMERS=['久田 友佳 様','カフェ・ソレイユ','佐藤商店','田中 様'];
// 商品：在庫（販売可能在庫＝在庫マスター在庫リスト由来）
var PRODUCTS=[
  {sku:'ORG250', name:'オルガニック 250ml', stock:50},
  {sku:'ORG500', name:'オルガニック 500ml', stock:11},
  {sku:'MEM250', name:'メメジック 250ml',   stock:107},
  {sku:'CHF100', name:'シェフズブレンド 100ml', stock:519}
];
var ENTRIES=[]; // {cust, sku, name, qty, type, date}

function prod(sku){ return PRODUCTS.find(function(p){return p.sku===sku;}); }
// 販売可能在庫＝元在庫 − その商品の取り置き合計（予約は在庫に効かない）
function heldOf(sku){ var s=0; ENTRIES.forEach(function(e){ if(e.sku===sku && e.type==='held') s+=e.qty; }); return s; }
function availOf(sku){ var p=prod(sku); return p? p.stock-heldOf(sku) : 0; }

function init(){
  var cs=document.getElementById('f-cust'); CUSTOMERS.forEach(function(c){ var o=document.createElement('option'); o.value=c; o.textContent=c; cs.appendChild(o); });
  var ps=document.getElementById('f-prod'); PRODUCTS.forEach(function(p){ var o=document.createElement('option'); o.value=p.sku; o.textContent=p.name; ps.appendChild(o); });
  renderList();
}
function kind(){ return document.querySelector('input[name=kind]:checked').value; }
function onKind(){
  var h=kind()==='held';
  document.getElementById('k-held').classList.toggle('on',h);
  document.getElementById('k-res').classList.toggle('on',!h);
  document.getElementById('date-lbl').textContent = h?'取り置き期限（いつまで）':'お届け予定日';
  onProd();
}
function onProd(){
  var sku=document.getElementById('f-prod').value;
  var el=document.getElementById('stockline');
  if(!sku){ el.innerHTML=''; return; }
  var avail=availOf(sku), qty=parseInt(document.getElementById('f-qty').value)||0;
  var msg='販売可能在庫：<b>'+avail+'</b> 本 <span class="src">（在庫マスター在庫リストより）</span>';
  if(kind()==='held' && qty>avail){
    msg+='<div class="stockwarn">⚠️ 取り置き'+qty+'本は在庫を超えています。取り置きは'+avail+'本までにして、残り'+(qty-avail)+'本は「予約」で足してください。</div>';
  }
  el.innerHTML=msg;
}
function addEntry(){
  var cust=document.getElementById('f-cust').value;
  var sku=document.getElementById('f-prod').value;
  var qty=parseInt(document.getElementById('f-qty').value)||0;
  var date=document.getElementById('f-date').value;
  var type=kind();
  if(!cust){ alert('お客様を選んでください'); return; }
  if(!sku){ alert('商品を選んでください'); return; }
  if(qty<=0){ alert('本数を入れてください'); return; }
  if(type==='held' && qty>availOf(sku)){ alert('取り置きは販売可能在庫（'+availOf(sku)+'本）を超えられません。\n残りは「予約」で足してください。'); return; }
  ENTRIES.push({cust:cust, sku:sku, name:prod(sku).name, qty:qty, type:type, date:date});
  document.getElementById('f-qty').value=''; document.getElementById('f-date').value='';
  onProd(); renderList();
}
function daysUntil(d){ if(!d) return null; return Math.round((new Date(d)-TODAY)/86400000); }
function fmt(d){ if(!d) return '指定なし'; var x=new Date(d); return (x.getMonth()+1)+'月'+x.getDate()+'日'; }
function delEntry(i){ ENTRIES.splice(i,1); onProd(); renderList(); }
function renderList(){
  var el=document.getElementById('list');
  if(!ENTRIES.length){ el.innerHTML='<div class="empty">まだありません。上の入力スペースから1件ずつ追加してください。</div>'; return; }
  var rows='<table><thead><tr><th>お客様</th><th>商品</th><th class="r">本数</th><th>種別</th><th>期限／予定日</th><th></th></tr></thead><tbody>';
  ENTRIES.forEach(function(e,i){
    var d=daysUntil(e.date), cls=(d!==null&&d<0)?'over':(d!==null&&d>=0&&d<=3)?'soon':'';
    var dtxt=fmt(e.date)+((d!==null&&d<0)?'（期限切れ）':(d!==null&&d>=0&&d<=3)?'（間近）':'');
    rows+='<tr><td>'+e.cust+'</td><td>'+e.name+'</td><td class="r">'+e.qty+'本</td>'+
      '<td>'+(e.type==='held'?'<span class="badge b-held">🗄 取り置き</span>':'<span class="badge b-res">🗓 予約</span>')+'</td>'+
      '<td class="'+cls+'">'+dtxt+'</td>'+
      '<td><button class="del" onclick="delEntry('+i+')">削除</button></td></tr>';
  });
  rows+='</tbody></table>';
  el.innerHTML=rows;
}
init();
</script>
</body>
</html>
