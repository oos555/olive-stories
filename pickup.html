<style>

.lb-urgent{background:#fee2e2;border:2px solid #dc2626;color:#991b1b}
.lb-sched{background:#fee2e2;border:2px solid #dc2626;color:#991b1b}
.lb-defect{background:#dbeafe;border:2px solid #2563eb;color:#1e3a8a}

.ctype-pill{display:inline-block;font-size:14px;font-weight:700;padding:5px 14px;border-radius:99px;margin:2px 4px 2px 0}
.ctype-rt{background:#f3e8ff;color:#6b21a8}
.ctype-rtgc{background:#dcfce7;color:#14532d}
.ctype-w1{background:#dbeafe;color:#1e3a8a}
.ctype-w2{background:#e0e7ff;color:#3730a3}
.rt-docs{background:#fff8ea;border:2px solid #d9a441;border-radius:10px;padding:12px;margin-bottom:12px}
.rt-docs .rt-docs-t{font-size:14px;font-weight:700;color:#8a5a1c;margin-bottom:8px}
.rt-doc-item{display:flex;align-items:center;gap:10px;margin-bottom:6px;font-size:15px;color:#8a5a1c;font-weight:600}

.actions{background:#f5f4f0;padding:10px 0;margin-top:10px}
.btn-big{width:100%;padding:16px;border-radius:10px;border:none;font-size:16px;font-weight:700;cursor:pointer;margin-bottom:10px}
.btn-complete{background:#2563eb;color:#fff}

.pack-check-item{display:flex;align-items:center;gap:5px;background:#fef3c7;border:1px solid #f3d9a8;border-radius:99px;padding:6px 12px;font-size:12px;font-weight:600;color:#78350f;cursor:pointer;white-space:nowrap}
.pack-check-item input{width:16px;height:16px}
.pack-check-item:has(input:checked){background:#dcfce7;border-color:#86efac;color:#14532d}
.btn-complete:disabled{background:#c7d7f5;color:#eef}
.btn-print{background:#2563eb;color:#fff;border:none}
.done-banner{background:#dcfce7;border:2px solid #16a34a;color:#14532d;border-radius:10px;padding:16px;text-align:center;font-weight:700;font-size:16px;margin-bottom:14px}
.invoice{background:#fff;border:1px solid #e8e2d8;border-radius:8px;padding:1.5rem 1.2rem}
.invoice-title{font-size:18px;font-weight:700;text-align:center;margin-bottom:1.2rem;letter-spacing:.08em}
.invoice-box{border:1px solid #d5cfc3;border-radius:6px;padding:10px 12px;margin-bottom:10px;font-size:13px}
.invoice-box-label{font-size:11px;color:#57534e;margin-bottom:6px;font-weight:600}
.invoice-table{width:100%;border-collapse:collapse;font-size:13px;margin-bottom:10px}
.invoice-table th{background:#f9f8f5;padding:6px 8px;text-align:left;border:1px solid #e8e2d8;font-size:11px;color:#2b2a26}
.invoice-table td{padding:7px 8px;border:1px solid #e8e2d8}
.badge-ctype{display:inline-block;border-radius:6px;padding:3px 10px;font-size:11px;font-weight:700;margin-left:6px}
.badge-wholesale1{background:#dbeafe;color:#1e3a8a}
.badge-wholesale2{background:#e0e7ff;color:#3730a3}
.badge-rt{background:#f3e8ff;color:#6b21a8}
.badge-rtgc{background:#dcfce7;color:#14532d}
.badge-defectprice{background:#fee2e2;color:#7f1d1d}
.invoice-notice{margin-top:1.2rem;padding-top:1rem;border-top:1px solid #e8e2d8;font-size:10.5px;color:#2b2a26;line-height:1.7}
.summary-card{background:#6b7a3a;color:#fff;border-radius:12px;padding:16px;margin-bottom:14px;text-align:center}
.summary-num{font-size:28px;font-weight:700}
.summary-sub{font-size:13px;color:#f0ece3;margin-top:4px}
.order-item{background:#fff;border:1px solid #e8e2d8;border-radius:12px;padding:14px 16px;margin-bottom:10px;cursor:pointer}
.order-item:active{background:#f5f4f0}
.order-item .oi-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px}
.order-item .oi-name{font-weight:700;font-size:15px}
.order-item .oi-num{font-size:11px;color:#57534e}
.order-item .oi-products{font-size:12px;color:#2b2a26;margin-top:4px}
.refresh-btn{width:100%;padding:12px;border-radius:10px;border:1px solid #d5cfc3;background:#fff;color:#2b2a26;font-weight:600;font-size:14px;margin-bottom:14px}
.defect-btn{width:100%;padding:12px;border-radius:10px;border:1px solid #dc2626;background:#fef2f2;color:#991b1b;font-weight:700;font-size:14px;margin-bottom:14px}
.form-group{margin-bottom:14px}
.form-group label{display:block;font-size:12px;color:#2b2a26;font-weight:600;margin-bottom:5px}
.form-group select,.form-group input,.form-group textarea{width:100%;padding:11px;border:1px solid #d5cfc3;border-radius:8px;font-size:15px;background:#fff;color:#2b2a26}
.form-group textarea{resize:vertical;min-height:60px;font-family:inherit}
/* ★2026-08-17 ひろみさん指示：倉庫のメモ欄が小さすぎて「見づらい・書きづらい・確認しづらい」。
   原因：#note-global は .form-group の外にあるため上のCSSがまったく当たらず、
   ブラウザの初期サイズ（2行ぶん・横20文字ぶん）のままだった。
   ★この指定を消すと、また極小の窓に戻ります。消さないでください。 */
#note-global{
  width:100%; box-sizing:border-box;
  padding:14px 15px;
  border:1.5px solid #6b7a3a; border-radius:8px; background:#fff; color:#2b2a26;
  font-family:inherit; font-size:16px; line-height:1.9;
  min-height:190px; resize:vertical;
}
#note-global:focus{ outline:none; border-color:#4a5a1f; box-shadow:0 0 0 3px rgba(107,122,58,.18) }
.material-card{display:flex;gap:12px;background:#f9f8f5;border-radius:10px;padding:12px;margin-bottom:10px;align-items:flex-start}
.material-photo{width:72px;height:72px;border-radius:8px;object-fit:cover;background:#eee;flex-shrink:0}
.material-photo-empty{width:72px;height:72px;border-radius:8px;background:#eee;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:24px;color:#bbb}
.material-info{flex:1;min-width:0}
.material-name{font-weight:700;font-size:15px}
.material-size{font-size:12px;color:#2b2a26;margin-top:2px}
.material-qty-row{display:flex;align-items:center;gap:8px;margin-top:8px}
.material-qty-btn{width:32px;height:32px;border-radius:8px;border:1px solid #d5cfc3;background:#fff;font-size:16px;font-weight:700;cursor:pointer}
.material-qty-num{font-size:18px;font-weight:700;min-width:36px;text-align:center}
.back-link{display:block;width:100%;box-sizing:border-box;margin-bottom:12px;background:#6b7a3a;color:#fff;font-size:16px;font-weight:600;padding:13px;border-radius:9px;text-align:center;cursor:pointer}
.back-link:active{background:#55622e}
.btn-blue{background:#2563eb;color:#fff}
.btn-blue:active{background:#1d4ed8}
.home-banner{background:#6b7a3a;color:#fff;border-radius:9px;padding:10px;text-align:center;margin-bottom:10px}
.home-banner .hb-title{font-size:16px;font-weight:700}
.home-banner .hb-sub{font-size:11px;opacity:.9;margin-top:1px}
.tools-box{margin-bottom:12px}
.tools-box>summary{list-style:none;cursor:pointer;background:#fff;border:1.5px solid #d5cfc3;border-radius:9px;padding:11px 13px;font-size:14px;font-weight:600;color:#2b2a26;display:flex;justify-content:space-between;align-items:center;gap:8px}
.tools-box[open]>summary{border-color:#6b7a3a;color:#3b4a1a}
.tools-box>summary::-webkit-details-marker{display:none}
.tool-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:9px}
.tool-tile{border-radius:11px;padding:13px 4px;text-align:center;cursor:pointer;border:2px solid}
.tool-tile:active{filter:brightness(0.97)}
.tool-tile .tt-ic{font-size:23px;line-height:1}
.tool-tile .tt-tx{font-size:13px;font-weight:700;margin-top:3px}
.pk-card{background:#fff;border:1px solid #e5e3da;border-radius:11px;padding:11px 12px;margin-bottom:8px;cursor:pointer}
.pk-card:active{filter:brightness(0.98)}
.pk-card.pk-urg{background:#fdecec;border-color:#f3c9c9}
.pk-card.pk-done{background:#f5f3ec}
.pk-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.pk-name{font-size:16px;font-weight:700;color:#2b2a26}
.pk-done .pk-name{color:#8a887f}
.pk-stat-wait{font-size:13px;color:#b45309;font-weight:700;white-space:nowrap}
.pk-stat-done{font-size:13px;color:#6b7a3a;font-weight:700;white-space:nowrap;text-align:right}
.pk-stat-done .pk-time{display:block;font-size:10px;color:#a6a49c;font-weight:600}
.pk-marks{margin-top:2px}
.pk-items{font-size:13px;color:#2b2a26;margin-top:4px;line-height:1.45}
.pk-done .pk-items{color:#8a887f}
.pk-dates{display:flex;gap:16px;margin-top:5px}
.pk-dates span{font-size:13px;color:#2b2a26}
.pk-dates b{font-weight:700}
.pk-wish-has{color:#185fa5 !important;font-weight:700}
.admin-back{margin-top:16px;text-align:center}
.admin-back a{display:inline-block;font-size:13px;color:#185fa5;font-weight:600;border:1px solid #b5d4f4;border-radius:20px;padding:7px 16px;cursor:pointer;text-decoration:none}
.admin-back .ab-note{font-size:11px;color:#9ca3af;margin-top:5px}
/* ── 熨斗（のし）シート A4横 ── */
.noshi-preview-frame{background:#fff;border:1px solid #e8e2d8;border-radius:10px;padding:8px;margin-bottom:14px;overflow:hidden}
.noshi-sheet{position:relative;width:100%;aspect-ratio:297/210;background:#fff;font-family:'Yu Mincho','Hiragino Mincho ProN',serif}
.noshi-img{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:100%;height:auto;display:block;z-index:1}
.noshi-title{position:absolute;left:50%;top:8%;transform:translateX(-50%);writing-mode:vertical-rl;font-size:5.2vw;letter-spacing:.12em;color:#2b2a26;font-weight:600;line-height:1.15;text-align:center;z-index:2}
.noshi-namewrap{position:absolute;left:50%;bottom:6%;transform:translateX(-50%);display:flex;flex-direction:row-reverse;align-items:flex-start;gap:1.5vw;z-index:2}
.noshi-name{writing-mode:vertical-rl;font-size:4.6vw;letter-spacing:.1em;color:#2b2a26;line-height:1.15;text-align:center}
.noshi-side{display:flex;flex-direction:row-reverse;gap:.6vw}
.noshi-side-col{writing-mode:vertical-rl;font-size:2.3vw;letter-spacing:.08em;color:#57534e;line-height:1.15}
@media print{
  .no-print{display:none!important}
  body{background:#fff}
  /* ★2026-08-19 ふだんの印刷は【A4 縦】。ここが landscape 固定だったため、納品書が
     2枚に分かれて出ていました（倉庫の印刷代が倍になる）。★portrait を消さないでください。
     のし（横）を刷るときだけ、printNoshi が一時的に横向きの設定を足します。 */
  /* ★2026-08-19 余白を0にしているのは、ブラウザが勝手に足す【日付・ページ名・URL】を
     印刷に出さないためです（お客様に倉庫アプリのURLが渡ってしまうため）。
     余白は書類側の padding で作っています。★margin を戻さないでください */
  @page{size:A4 portrait;margin:0}
  .invoice-doc{font-size:11pt}
  .doc2-title{font-size:20pt;margin-bottom:6mm}
  .doc2-items{font-size:9.5pt}
  .invoice-doc-note{font-size:8.5pt;line-height:1.6;padding:6px 9px;margin-top:6px}
  #noshi-print-area{display:block}
  #noshi-print-area .noshi-sheet{width:297mm;height:210mm;aspect-ratio:auto;page-break-after:avoid}
  #noshi-print-area .noshi-title{font-size:44pt;top:9%}
  #noshi-print-area .noshi-name{font-size:38pt}
  #noshi-print-area .noshi-side-col{font-size:18pt}
  #noshi-print-area .noshi-namewrap{gap:8mm}
  #noshi-print-area .noshi-side{gap:3mm}
}
#main-wrap{display:none}
#main-wrap.gate-open{display:block}
.pres-overlay{display:none;position:fixed;inset:0;background:rgba(43,42,38,.45);z-index:9998;align-items:center;justify-content:center;padding:16px}
.pres-overlay.show{display:flex}
.pres-modal{background:#fff;border-radius:16px;padding:26px 24px;max-width:340px;width:100%;text-align:center;box-shadow:0 12px 30px rgba(0,0,0,.18)}

const GAS_URL = 'https://script.google.com/macros/s/AKfycbwRNgyNZ3HjU7nPSpxCn7uUiMu3MY6ZijEsCtB7Toj_7x9Fu1v5VFyMDLheNZAON4OV/exec';

/* ════════════════════════════════════════════════════════════════
   倉庫Dの鍵（玄関 home.html とは別パスワード・別の記憶印）
   ・localStorage の oos_gate_ok_pickup に '1' が入っていれば、
     この端末ではもう聞かない（日付での区切りなし）
   ・玄関の印(oos_gate_ok)とは別キーなので、玄関を開けても倉庫Dは改めて聞く
   ・パスワード照合は GAS の verifyPassword(group:'d') で行う
     （GAS側 GROUP_PASSWORDS の d = 倉庫D専用パスワード。玄関 gate とは別物）
   ════════════════════════════════════════════════════════════════ */
function gateCheck(){
  let ok = false;
  try{ ok = localStorage.getItem('oos_gate_ok_pickup') === '1'; }catch(e){}
  if(ok){
    document.getElementById('main-wrap').classList.add('gate-open');
  } else {
    document.getElementById('gate-overlay').classList.add('show');
    setTimeout(()=>document.getElementById('gate-pw-input').focus(), 50);
  }
}
async function gateUnlock(){
  const pw = document.getElementById('gate-pw-input').value;
  const errEl = document.getElementById('gate-err');
  const okBtn = document.getElementById('gate-ok-btn');
  errEl.textContent = '';
  if(!pw){ errEl.textContent = 'パスワードを入れてください'; return; }
  okBtn.disabled = true;
  try{
    const res = await fetch(GAS_URL, {
      method:'POST',
      body: JSON.stringify({ action:'verifyPassword', group:'d', password: pw }),
      headers: {'Content-Type':'text/plain;charset=utf-8'}
    });
    const data = await res.json();
    if(data.status==='ok'){
      try{ localStorage.setItem('oos_gate_ok_pickup','1'); }catch(e){}
      document.getElementById('gate-overlay').classList.remove('show');
      document.getElementById('main-wrap').classList.add('gate-open');
    } else {
      errEl.textContent = data.message ? ('エラー：'+data.message) : 'パスワードが違います';
    }
  }catch(err){
    errEl.textContent = '通信エラーが発生しました';
  }finally{
    okBtn.disabled = false;
  }
}

// あわせて、ブラウザが古い返事を使い回して最新が出ない問題を防ぐため cache:'no-store' を既定にする。
function fetchWithTimeout(url, opts, ms){
  ms = ms || 40000;
  var ctrl = (typeof AbortController!=='undefined') ? new AbortController() : null;
  var timer = setTimeout(function(){ if(ctrl) ctrl.abort(); }, ms);
  var o = Object.assign({}, opts||{});
  if(ctrl) o.signal = ctrl.signal;
  if(!o.cache) o.cache = 'no-store';
  return fetch(url, o).finally(function(){ clearTimeout(timer); });
}

// ── 日付はすべて日本時間（JST, UTC+9）を基準に解釈する ──
// どんな形式（'2026-07-31' / '2026/7/31' / '2026-07-31T15:00:00.000Z'）が来ても、
// 日本時間で「何年何月何日」かを取り出す。読めない場合は null。
function toJstDate(v){
  if(!v) return null;
  var s = String(v).trim();
  if(/^\d{4}-\d{2}-\d{2}$/.test(s)){
    var m = s.split('-');
    return new Date(Number(m[0]), Number(m[1])-1, Number(m[2]));
  }
  var d = new Date(s.indexOf('/')>=0 && s.indexOf('T')<0 ? s.replace(/-/g,'/') : s);
  if(isNaN(d.getTime())) return null;
  if(/Z$|[+\-]\d{2}:?\d{2}$/.test(s)){
    // タイムゾーン付きの機械形式 → 端末の設定に関係なく日本時間(+9時間)に固定変換
    var j = new Date(d.getTime() + 9*60*60*1000);
    return new Date(j.getUTCFullYear(), j.getUTCMonth(), j.getUTCDate());
  }
  return new Date(d.getFullYear(), d.getMonth(), d.getDate());
}
// 日本時間での YYYY-MM-DD 文字列を作る
function isoDayJst(dateObj){
  var j = new Date(dateObj.getTime() + 9*60*60*1000);
  return j.toISOString().slice(0,10);
}
// 日本時間での「今日」の YYYY-MM-DD
function todayIsoJst(){
  return isoDayJst(new Date());
}
function computeDueDateISO(o){
  if(o.leadType==='scheduled'){
    var sd = toJstDate(o.leadDate);
    if(!sd) return '';
    var mm = ('0'+(sd.getMonth()+1)).slice(-2), dd = ('0'+sd.getDate()).slice(-2);
    return sd.getFullYear()+'-'+mm+'-'+dd;
  }
  const days = o.leadType==='urgent' ? 1 : (o.leadType==='normal' ? 3 : null);
  if(days===null) return '';
  const base = o.registeredAt ? new Date(o.registeredAt) : new Date();
  if(isNaN(base.getTime())) return '';
  base.setTime(base.getTime() + days*24*60*60*1000);
  return isoDayJst(base);
}
function formatDateJp(v){
  var d = toJstDate(v);
  if(!d) return v ? String(v) : '';
  return (d.getMonth()+1)+'月'+d.getDate()+'日';
}
function leadLabelWithDate(o){
  const due = computeDueDateISO(o);
  const dueStr = due ? formatDateJp(due)+'までに出荷' : '';
  if(o.leadType==='urgent') return '🚨急ぎ（翌営業日までに発送）';
  if(o.leadType==='normal') return '通常（1週間以内にお届け）';
  if(o.leadType==='defect') return '🔵不良在庫出荷';
  if(o.leadType==='caution') return '🟡特別注意';
  if(o.leadType==='scheduled') return '🗓 '+(due?formatDateJp(due)+'までに出荷':'日程未指定');
  return o.leadType;
}
function isOverdue(o){
  if(o.status!=='pending') return false;
  const due = computeDueDateISO(o);
  if(!due) return false;
  const todayISO = todayIsoJst();
  return due < todayISO;
}

}

function findProduct(pid){ return PRODUCTS.find(p=>p.id==pid); }
var LOTS_BY_PID = {}; var LOTS_LOADED = false;
async function ensureLotsLoaded(){
  if(LOTS_LOADED) return;
  try{
    const res = await fetch(bust(GAS_URL + '?action=loadAllData&skip=productLabels'), {cache:'no-store'});
    const data = await res.json();
    if(data && data.status==='ok' && data.data && Array.isArray(data.data.lots)){
      var map = {};
      data.data.lots.forEach(function(l){
        var pid = parseInt(l.pid); if(isNaN(pid)) return;
        if(!map[pid]) map[pid] = [];
        map[pid].push({ expiry:l.expiry, status:l.status, stock:parseInt(l.stock)||0 });
      });
      LOTS_BY_PID = map; LOTS_LOADED = true;
    }
    if(data && data.data && Array.isArray(data.data.priceMaster)) PRICE_MASTER = data.data.priceMaster;
  }catch(e){}
}
function resolveProduct(l){
  if(l==null) return null;
  var p = (l.productId!=null) ? findProduct(l.productId) : null;
  if(p) return p;
  var key = String(l.productId!=null ? l.productId : (l.sku||''));
  return PRODUCTS.find(function(x){ return String(x.sku)===key; }) || null;
}
/* ★2026-07-25 バーコードは統合マスタNの「名簿」が親。
   名簿の「バーコード」列（extras）→ jan列 → 注文明細 の順に見る。 */
function pBarcodeOf(p){
  if(!p) return '';
  var v = p['バーコード'];
  if(!v && p.extras) v = p.extras['バーコード'];
  if(!v) v = p.jan || p.barcode || '';
  return String(v||'').trim();
}
/* 表示する品番コード＝品番＋バーコード下4桁。バーコードが無ければ品番だけ */
function dispCodeOf(p){
  if(!p || !p.sku) return '';
  var d = pBarcodeOf(p).replace(/[^0-9A-Za-z]/g,'');
  var tail = d.length>=4 ? d.slice(-4) : '';
  return tail ? (String(p.sku)+'-'+tail) : String(p.sku);
}
function lineBarcode4(l){
  var p = resolveProduct(l);
  var jan = pBarcodeOf(p) || (l && (l.jan || l.barcode)) || '';
  jan = String(jan).replace(/[^0-9]/g,'');
  return jan.length>=4 ? jan.slice(-4) : (jan || '―');
}
/* ピッキング画面に出す「品番－末尾4桁」。末尾だけだと見間違えるので品番を保険に付ける */
function lineCodeHtml(l){
  var p = resolveProduct(l);
  var sku = (p && p.sku) ? String(p.sku) : String((l && l.sku) || '');
  var t4 = lineBarcode4(l);
  if(!sku) return '<span class="bc-v">'+esc(t4)+'</span>';
  if(t4==='―') return '<span class="bc-sku">'+esc(sku)+'</span>';
  return '<span class="bc-sku">'+esc(sku)+'-</span><span class="bc-v">'+esc(t4)+'</span>';
}
function lineExpiry(l){
  /* 在庫(stock.html)の正規(new)ロットのうち、賞味期限がいちばん古いもの（先入れ先出し）を表示。無ければ「―」。 */
  var p = resolveProduct(l);
  var pid = p ? p.id : null;
  if(pid==null || !LOTS_BY_PID[pid]) return '―';
  var arr = LOTS_BY_PID[pid];
  var cand = arr.filter(function(x){ return x.status==='new' && x.expiry && x.stock>0; });
  if(!cand.length) cand = arr.filter(function(x){ return x.status==='new' && x.expiry; });
  if(!cand.length) return '―';
  cand = cand.slice().sort(function(a,b){ return String(a.expiry).localeCompare(String(b.expiry)); });
  return String(cand[0].expiry);
}

let EXTRA_FIELDS = [];
const PRODUCTS_CACHE_KEY = 'oos_products_cache_v1';

function loadProductsFromCache(){
  try{
    const raw = localStorage.getItem(PRODUCTS_CACHE_KEY);
    if(!raw) return null;
    const obj = JSON.parse(raw);
    if(obj && Array.isArray(obj.products) && obj.products.length) return obj;
  }catch(e){}
  return null;
}
function saveProductsToCache(products, extraFields){
  try{
    localStorage.setItem(PRODUCTS_CACHE_KEY, JSON.stringify({ products: products, extraFields: extraFields||[] }));
  }catch(e){}
}
function applyLoadedProducts(products, extraFields){
  if(!products || !products.length) return;
  PRODUCTS = products;
  EXTRA_FIELDS = extraFields || [];
  // 「不良品を報告する」画面が開いている場合は、商品プルダウンを選択値を保ったまま作り直す
  const dfSelect = document.getElementById('df-product');
  if(dfSelect){
    const prev = dfSelect.value;
    dfSelect.innerHTML = productOptionsHtml();
    if(prev) dfSelect.value = prev;
  }
}
async function initializeProducts(){
  const cached = loadProductsFromCache();
  if(cached) applyLoadedProducts(cached.products, cached.extraFields);
  try{
    const res = await fetch(GAS_URL + '?action=loadProducts');
    const data = await res.json();
    if(data && data.status==='ok' && Array.isArray(data.products) && data.products.length){
      saveProductsToCache(data.products, data.extraFields);
      applyLoadedProducts(data.products, data.extraFields);
    }
  }catch(e){
    // 通信失敗時はキャッシュ、またはハードコードの初期値のまま動作を続ける
  }
}

/* ══════════════════════════════════════════════════════════════════════
   単価と消費税の出し方。★売上Ｃ（billing.html）からそのまま写しています。
   金額が2つのアプリで食い違うと請求の事故になるため、
   tests/test_apps.js が「売上Ｃと同じか」を毎回見張っています。
   ★ここだけ書き換えないでください（直すときは billing.html と両方）。
   価格マスタに単価が無い商品は 0 が返ります。そのときは金額を出さず「―」と出します。
   ══════════════════════════════════════════════════════════════════════ */
var PRICE_MASTER = [];
const BULK_UPGRADE_BOXES = 6; // 卸①のお客様が、同じ商品を1回の注文でこの箱数以上買うと、その行だけ自動的に卸②価格になる
function findProductBySku(sku){ return PRODUCTS.find(p=>p.sku===sku); }
function defaultTaxRateForGroup(group){
  return (group==='ギフト箱・備品' || group==='その他') ? 0.10 : 0.08;
}
function taxRateForSku(sku){
  const p = PRICE_MASTER.find(x=>x.sku===sku);
  if(p && p.taxRate!=null && p.taxRate!=='') return parseFloat(p.taxRate);
  const prod = findProductBySku(sku);
  return defaultTaxRateForGroup(prod?prod.group:'');
}
function effectiveCustomerType(customerType, boxes){
  if(customerType==='wholesale1' && (boxes||0) >= BULK_UPGRADE_BOXES) return 'wholesale2';
  return customerType;
}
function lineTierType(o, l){
  if(l && l.giftType==='w1') return 'wholesale1';
  if(l && l.giftType==='w2') return 'wholesale2';
  return effectiveCustomerType(o.customerType, (l&&l.boxes)||0);
}
function priceForSku(sku, customerType){
  const p = PRICE_MASTER.find(x=>x.sku===sku);
  if(!p) return 0;
  const map = { general:'priceGeneral', wholesale1:'priceWholesale1', wholesale2:'priceWholesale2', rt:'priceRT', rtgc:'priceRT', basara:'priceBasara', special:'priceSpecial', defectprice:'priceDefect' };
  const key = map[customerType] || 'priceGeneral';
  return parseFloat(p[key])||0;
}
/* ══════════════════════════════════════════════════════════════════════
   ★2026-08-19 ひろみさん指示（最重要）
   「納品書は、納品書です。RTは私たちの隠語だから使ったら絶対にダメ」

   お客様にお渡しする書類には、社内の言葉を1文字も出しません。
   ・表題は お客様から見た書類の名前だけ（納品書／請求書／領収書／納品書兼請求書…）
   ・「RT発注伝票」「卸」「バサラ」などは表題から外す
   ・注文番号の暗号（TK- / BA- / RT- / OS1- / FT- など）も出さない
   ★この道具を通さずに、そのまま画面に出さないでください。
   ══════════════════════════════════════════════════════════════════════ */
var OOS_DOC_NAMES = ['納品書兼請求書','納品書兼領収書','納品書','請求書','領収書'];
function docTitleOf(encDoc){
  var d = String(encDoc || '');
  /* お客様向けの書類名だけを拾う（長い名前から先に見る） */
  for(var i=0; i<OOS_DOC_NAMES.length; i++){
    if(d.indexOf(OOS_DOC_NAMES[i]) >= 0) return OOS_DOC_NAMES[i];
  }
  return '納品書';
}
/* 注文番号から社内の暗号（TK/BA/RT/OS1/OS2/IT/FT/RTG）を外す */
function docNumberOf(num){
  /* 暗号は TK / BA / RT / RTG / OS1 / OS2 / IT / FT など（英字＋数字のこともある） */
  return String(num || '').replace(/^[A-Za-z]+[0-9]*[-－]/, '');
}
/* 注文メモから、伝票番号と納品予定日を取り出す（RT取込の注文だけ入っています） */
function docSlipNoOf(o){
  var m = String((o && o.note) || '').match(/伝票番号\s*([0-9A-Za-z\-]+)/);
  return m ? m[1] : '';
}
function docDeliveryDateOf(o){
  var m = String((o && o.note) || '').match(/納品予定日\s*([0-9]{4}[\/\-][0-9]{1,2}[\/\-][0-9]{1,2})/);
  return m ? m[1].replace(/-/g, '/') : '';
}

/* この書類に金額を入れるか（請求書・領収書を兼ねるときだけ入れる） */
function invoiceNeedsAmount(encDoc){
  var d = String(encDoc||'');
  return d.indexOf('請求書') >= 0 || d.indexOf('領収書') >= 0;

function buildInvoiceHtml(o){
  /* ★2026-08-19 表題は、受注Ａで選んだ同梱書類の名前をそのまま出す
     （納品書／納品書兼請求書／請求書／領収書…）。「納品書」で固定しないでください。
     体裁は見積・請求書Ｍで決めたもの（oos-doc.js）を使います。 */
  /* ★2026-08-19 表題は【お客様から見た書類の名前】だけ。社内の言葉（RT・卸など）は出さない */
  const docName = docTitleOf(o.enclosedDoc && o.enclosedDoc !== 'なし' ? o.enclosedDoc : '納品書');
  /* ★2026-08-19 RT（ホテル・レストラン）は、ギフトでも【金額の入った書類】を必ず入れる

  (o.lines||[]).forEach(function(l){
    var prod = findProduct(l.productId);
    var sku = prod ? prod.sku : '';
    var qty = lineTotal(l);
    var unit = (withAmount && sku) ? priceForSku(sku, lineTierType(o, l)) : 0;
    if(withAmount && !unit) unknown = true;
    items.push({
      name: l.productName,
      qty: qty,
      qtyText: qty + '本' + (l.boxes ? '（バラ'+l.bottles+'＋'+l.boxes+'箱）' : ''),

  var foot = '<strong>🎁 大切な人にお贈りする最高のギフトをご用意しています。</strong>　複数のお届け先へのギフト発送も承っております。'
    + '<br>'

  notes.push(foot);

  var html = OOS_DOC.buildDoc({
    title: docName + (badge ? '' : ''),

    metaRight: (function(){

/* ════════════════════════════════════════════════════════════════
   熨斗（のし）印刷 — すみれ画像を使ったA4横1枚
   受注の noshi:{ title, name, company, position } を使います。
   印刷前に必ずプレビュー（見本）を表示してから印刷します。
   ════════════════════════════════════════════════════════════════ */
let noshiPrinted = false;

function hasNoshi(o){
  return !!(o && o.noshi && (o.noshi.title || o.noshi.name || o.noshi.company || o.noshi.position));
}
function buildNoshiHtml(n){
  const title = esc(n.title||'');
  const name = esc(n.name||'');
  const company = esc(n.company||'');
  const position = esc(n.position||'');
  const sideLines = [position, company].filter(Boolean);
  const sideChars = sideLines.length
    ? sideLines.map(function(line){ return '<div class="noshi-side-col">'+line+'</div>'; }).join('')
    : '';
  let html = '';
  html += '<div class="noshi-sheet">';
  html +=   '<img class="noshi-img" src="'+NOSHI_IMAGE+'" alt="熨斗の花飾り" onerror="this.style.display=\'none\';var w=document.getElementById(\'noshi-img-fallback\');if(w)w.style.display=\'block\'">';
  html +=   '<div id="noshi-img-fallback" style="display:none;text-align:center;color:#b91c1c;font-size:13px;font-weight:700;padding:10px">⚠️ 花の画像（'+NOSHI_IMAGE+'）が読み込めませんでした。GitHubにこの名前で画像が上がっているか確認してください。</div>';
  html +=   '<div class="noshi-title">'+title+'</div>';
  html +=   '<div class="noshi-namewrap">';
  html +=     (sideChars ? '<div class="noshi-side">'+sideChars+'</div>' : '');
  html +=     '<div class="noshi-name">'+name+'</div>';
  html +=   '</div>';
  html += '</div>';
  return html;
}
function previewNoshi(){
  if(!currentOrder || !hasNoshi(currentOrder)) return;
  const n = currentOrder.noshi;
  const sub = [esc(n.position), esc(n.company)].filter(Boolean).join('　');
  let html = '<div class="back-link no-print" onclick="renderOrder()">← 注文の画面に戻る</div>';
  html += '<div class="card no-print" style="background:#fdf6ee;border-color:#e8d9c4">';
  html += '<div class="sec-title" style="margin-top:0;color:#8a5a1c">🎀 熨斗の見本（この内容で印刷します）</div>';
  html += '<div style="font-size:13px;color:#2b2a26;line-height:1.8">表書き：<strong>'+esc(n.title||'-')+'</strong><br>お名前：<strong>'+esc(n.name||'-')+'</strong>'+(sub?'<br>社名・役職：'+sub:'')+'</div>';
  html += '<div style="font-size:12px;color:#8a7f6a;margin-top:8px">下が実際に印刷される熨斗のイメージです。よければ「この熨斗を印刷する」を押してください。印刷が終わると「梱包完了」ボタンが押せるようになります。</div>';
  html += '</div>';
  html += '<div class="noshi-preview-frame no-print">' + buildNoshiHtml(n) + '</div>';
  html += '<div class="actions no-print">';
  html += '<button class="btn-big" style="background:#2563eb;color:#fff" onclick="printNoshi()">🖨 この熨斗を印刷する</button>';
  html += '<button class="btn-big btn-print" onclick="renderOrder()">← 戻る</button>';
  html += '</div>';
  document.getElementById('content').innerHTML = html;
  window.scrollTo({top:0,behavior:'smooth'});
}
function printNoshi(){
  if(!currentOrder || !hasNoshi(currentOrder)) return;
  if(isInAppBrowser()){
    alert('このアプリ内のブラウザでは印刷ができません。\n\n右上の「…」または「メニュー」ボタンから「Safari／Chromeで開く」を選んでから、もう一度印刷をお試しください。');
    return;
  }
  document.getElementById('noshi-print-area').innerHTML = buildNoshiHtml(currentOrder.noshi);
  document.getElementById('content').style.display = 'none';
  document.getElementById('inapp-banner').style.display = 'none';
  document.getElementById('noshi-print-area').style.display = 'block';
  /* ★のしだけはA4横。印刷のあいだだけ横向きの設定を足して、終わったら外す */
  var _land = document.createElement('style');
  _land.textContent = '@page{size:A4 landscape;margin:0}';
  document.head.appendChild(_land);
  window.print();
  _land.remove();
  document.getElementById('noshi-print-area').style.display = 'none';
  document.getElementById('content').style.display = '';

  renderOrder();

}

// ════════════════════════════════════
// ★ 在庫を見る（本数）— 見るだけ・在庫Bと同じデータ／同じ計算
// ════════════════════════════════════
// セット商品は受注生産なので在庫単位では出さない。それ以外（備品ふくむ）は表示する。
const STOCK_HIDE_GROUPS = { 'セット商品':1 };
// 備品グループ：在庫Bに数の記録が無くても、一覧には出す（倉庫の置き場所の目安になるように）
const STOCK_SUPPLY_GROUPS = { 'ギフト箱・備品':1, '備品':1, '資材':1, 'その他':1 };

// ════════════════════════════════════
// ★ 倉庫に「見せる／見せない」在庫のコントロール（中村様が決める場所）
//   方法1（おすすめ・自分で管理）：統合マスターN（名簿）に「倉庫非表示」という列を作り、
//     倉庫に見せたくない商品にしるし（○ や × など）を入れる。空欄なら見せる。倉庫Dは自動で従う。
//   方法2（かんたん・Claudeにお願い）：下の STOCK_HIDE_SKUS に品番（SKU）を足す。
//     例）'MISC001' を足すと、その商品が倉庫の在庫一覧から消える。
// ════════════════════════════════════
const STOCK_HIDE_SKUS = [
  // 例）'MISC001',   // サイン本は倉庫に見せない
];
function isWarehouseHidden(p){
  if(!p) return false;
  if(p.sku && STOCK_HIDE_SKUS.indexOf(String(p.sku))>=0) return true;   // 方法2：品番リスト
  var v = p['倉庫非表示'];                                              // 方法1：名簿の「倉庫非表示」列
  if((v===undefined||v===null||v==='') && p.extras) v = p.extras['倉庫非表示'];
  v = String(v==null?'':v).trim();
  if(!v || v==='0' || v==='表示' || v==='見せる') return false;         // 空欄・0・「表示」「見せる」＝見せる
  return true;                                                          // それ以外（○/×/1/はい/非表示 等）＝隠す
}

// 不良の「有効判定」：未処理の倉庫報告・却下・青(貼替)・黒(廃棄)は不良に数えない（在庫Bと同一ルール）
function isActiveDefect(d){ return OOS_ZAIKO.isActiveDefect(d); }   // ★親（oos-zaiko.js）を見に行く
// マスターN（master.html）の computeStockNumbers と同じ数え方（2026-08-13）。
//   現ロットと旧ロットは絶対に混ぜない。その行の数字は全部その行のロットのもの。
//   販売可能 ＝ 棚の良品 − 受注Aの取り置き
//   実在庫   ＝ 棚の良品 ＋ 不良 ＋ 手で入れた取置（廃棄は足さない＝もう倉庫にない）
function stockNumbersFor(pid, lots, defects, holds){
  // ★自分で計算しない。在庫の数え方は【親＝oos-zaiko.js】を見に行く。
  //   ここに計算式を書き写してはいけない（独自のコピーを持たない）。
  return OOS_ZAIKO.numbers(pid, { lots: lots, defects: defects, holds: holds });
}

async function loadStockScreen(){
  document.getElementById('content').innerHTML = '<div class="spinner">読み込み中...</div>';
  try{
    const res = await fetch(bust(GAS_URL + '?action=loadAllData&skip=productLabels'), {cache:'no-store'});
    const data = await res.json();
    if(data.status!=='ok' || !data.data){
      document.getElementById('content').innerHTML = '<div class="alert-danger">在庫を読み込めませんでした。</div>'+stockBackBtn();
      return;
    }
    const lots    = (data.data.lots||[]).map(function(l){ return { pid:parseInt(l.pid), stock:parseInt(l.stock)||0, status:l.status }; });
    const defects = (data.data.defects||[]).map(function(x){ return { pid:parseInt(x.pid), qty:parseInt(x.qty)||0, shippedQty:parseInt(x.shippedQty)||0, status:x.status||'pending', level:x.level||'', source:x.source||'', reviewed:!!x.reviewed, lotKind:x.lotKind||'' }; });
    const holds   = (data.data.holds||[]).map(function(h){ return { pid:parseInt(h.pid), qty:parseInt(h.qty)||0 }; });
    renderStockList(lots, defects, holds);
  }catch(err){
    document.getElementById('content').innerHTML = '<div class="alert-danger">通信エラーが発生しました。電波の良い場所でもう一度お試しください。<br><br>'+esc(err.message)+'</div>'+stockBackBtn();
  }
}

function stockBackBtn(){
  return '<button class="refresh-btn no-print" style="margin-top:12px;background:#6b7a3a;color:#fff;border:none;font-size:16px" onclick="location.href=\'pickup.html\'">← 出荷依頼書一覧にもどる</button>';
}

// 在庫を見る（表組み・見るだけ）：実在庫/販売可能/旧ロット/不良/取置/廃棄 ＋ 右端に入庫予定
function renderStockList(lots, defects, holds){
  // 取り扱っている商品（ロット記録か不良がある）だけ表示。0本でも表示。
  var tracked = {};
  lots.forEach(function(l){ tracked[l.pid]=true; });
  defects.forEach(function(d){ tracked[d.pid]=true; });

  var groups = {};
  var order = [];
  PRODUCTS.forEach(function(p){
    if(p.isSet) return;
    if(STOCK_HIDE_GROUPS[p.group]) return;
    if(isWarehouseHidden(p)) return;   // ★ 中村様が決めた「倉庫に見せない」商品はここで除外
    // オイル等は在庫記録があるものだけ表示。備品は記録が無くても一覧に出す。
    if(!tracked[p.id] && !STOCK_SUPPLY_GROUPS[p.group]) return;
    if(!groups[p.group]){ groups[p.group]=[]; order.push(p.group); }
    groups[p.group].push(p);
  });

  var html = '';
  html += '<div class="stock-head"><div class="stock-head-title">倉庫の在庫（見るだけ）</div>'
        + '<div class="stock-head-sub">数字を確認するだけのページです。ここでは在庫は変えられません。</div></div>';
  html += '<button class="refresh-btn no-print" onclick="loadStockScreen()">🔄 最新の数字に更新する</button>';

  if(!order.length){
    html += '<div class="card center" style="color:#57534e">表示できる在庫がありません。</div>' + stockBackBtn();
    document.getElementById('content').innerHTML = html;
    return;
  }

  html += '<div class="stock-note"><b style="color:#16a34a">販売可能</b>＝いま出荷につかえる本数。<br><b style="color:#b91c1c">赤い行＝旧ロット</b>。早めに出したいぶんです。<br>いちばん右の<b style="color:#1d4ed8">入庫予定</b>＝これから届く本数（置き場所の目安に）。<br>ギフト箱・紙袋などの<b>備品</b>も下の方に出ます。<b>「—」</b>はまだ数を管理していない備品です。</div>';

  html += '<table class="stk-tbl"><colgroup>'
        + '<col style="width:22%"><col style="width:13%"><col style="width:17%"><col style="width:12%"><col style="width:9%"><col style="width:9%"><col style="width:8%"><col style="width:10%">'
        + '</colgroup><thead><tr>'
        + '<th class="stk-name">商品</th><th>ロット</th><th class="stk-av">販売<br>可能</th><th>実在庫</th><th>不良</th><th>取置</th><th>廃棄</th><th class="stk-in">入庫<br>予定</th>'
        + '</tr></thead><tbody>';

  order.forEach(function(g){
    html += '<tr class="stk-grp-row"><td colspan="8">'+esc(g)+'</td></tr>';
    groups[g].forEach(function(p){
      var isTracked = !!tracked[p.id];
      var n = stockNumbersFor(p.id, lots, defects, holds);
      var box = p.boxQty ? '・1箱'+p.boxQty+'本' : '';
      var dash = '<span style="color:#c9c3b6">—</span>';
      var span = n.hasOld ? 3 : 1;
      // 現ロットの行（＋旧ロットがあれば旧ロットの行と合計行）。マスターNと同じ読み方。
      function lotRow(s, isOld){
        var h = '<tr class="'+(isOld?'stk-old':'stk-new')+'">';
        if(!isOld) h += '<td class="stk-nm" rowspan="'+span+'"><b>'+esc(p.name)+'</b><small>'+esc(dispCodeOf(p))+box+'</small></td>';
        h += '<td><span class="stk-lot'+(isOld?' old':'')+'">'+(isOld?'旧ロット':'現ロット')+'</span></td>';
        h += '<td class="stk-av-td">'+(isTracked?(s.sellable+(s.autoHold>0?'<span class="stk-sub">棚'+s.good+'（取置'+s.autoHold+'）</span>':'')):dash)+'</td>';
        h += '<td>'+(isTracked?stkNum(s.stock, '#2b2a26'):dash)+'</td>';
        h += '<td>'+(isTracked?stkNum(s.defectQty, '#dc2626'):dash)+'</td>';
        h += '<td>'+(isTracked?stkNum(s.holdQty, '#b45309'):dash)+'</td>';
        h += '<td>'+(isTracked?stkNum(s.discard, '#1a1a18'):dash)+'</td>';
        if(!isOld) h += '<td class="stk-in-td">'+(isTracked?(n.incoming===0 ? '<span style="color:#c9c3b6">0</span>' : n.incoming):dash)+'</td>';
        else       h += '<td class="stk-in-td">'+dash+'</td>';
        return h + '</tr>';
      }
      html += lotRow(n.cur, false);
      if(n.hasOld){
        html += lotRow(n.old, true);
        html += '<tr class="stk-total"><td>合計 →</td>'
              + '<td class="stk-av-td">'+n.avail+'</td>'
              + '<td>'+stkNum(n.stock, '#2b2a26')+'</td>'
              + '<td>'+stkNum(n.defectQty, '#dc2626')+'</td>'
              + '<td>'+stkNum(n.holdQty, '#b45309')+'</td>'
              + '<td>'+stkNum(n.discard, '#1a1a18')+'</td>'
              + '<td class="stk-in-td">'+(n.incoming===0 ? '<span style="color:#c9c3b6">0</span>' : n.incoming)+'</td></tr>';
      }
    });
  });

  html += '</tbody></table>';
  html += stockBackBtn();
  document.getElementById('content').innerHTML = html;
}

function stkNum(val, color){
  return '<span style="color:'+(val===0 ? '#c9c3b6' : color)+'">'+val+'</span>';
}

async function loadOrderList(isManual){
  // 「🔄更新」ボタンから呼ばれたときは、押した手ごたえ（お知らせ）を出す
  if(isManual) pickupToast('🔄 最新を確認しています…');
  // ① まずキャッシュがあれば一瞬で表示（戻ってきたときに待たせない）
  var hadCache = false;
  try{
    var c = sessionStorage.getItem('oos_pickup_orders_v1');
    if(c){
      var arr = JSON.parse(c);
      if(Array.isArray(arr)){ allOrders = arr; hadCache = true; try{ renderList(); }catch(e){} }
    }
  }catch(e){}
  if(!hadCache){
    document.getElementById('content').innerHTML = '<div class="spinner">読み込み中...</div>';
  }
  // ② そのあと裏で「必ず最新」を取りに行き、届いたら差し替える（キャッシュ回避）
  try{
    const [res, ] = await Promise.all([fetchWithTimeout(bust(GAS_URL + '?action=loadAll')), fetchWarehouseNotes()]);
    /* 区分の翻訳は下の orders 代入後に行う */
    const data = await res.json();
    if(data.status !== 'ok' || !data.data || !Array.isArray(data.data.orders)){
      if(isManual) pickupToast('⚠️ 更新できませんでした。電波を確認してください', true);
      if(!hadCache){ document.getElementById('content').innerHTML = '<div class="alert-danger">一覧を読み込めませんでした。</div><button class="refresh-btn no-print" style="border:1.5px solid #6b7a3a;background:#eef3e0;color:#3b4a1a;font-weight:700;margin-top:10px" onclick="loadOrderList(true)">🔄 もう一度読み込む</button>'; }
      return;
    }
    // 出荷待ち（出荷依頼書が送られたもの）＋ 本日 梱包完了したもの（当日中だけグレー表示、23:59を過ぎると自動で消える）
    data.data.orders.forEach(function(o){ o.customerType = normCtype(o.customerType); });
    allOrders = data.data.orders.filter(function(o){
      if(o.notified!==true) return false;
      if(o.status==='pending') return true;
      if(o.status==='shipped' && shippedToday(o)) return true;
      return false;
    });
    try{ sessionStorage.setItem('oos_pickup_orders_v1', JSON.stringify(allOrders)); }catch(e){}
    renderList();
    if(isManual) pickupToast('✅ 最新にしました（'+allOrders.filter(function(o){return o.status==='pending';}).length+'件）');
  }catch(err){
    var isAbort = (err && (err.name==='AbortError'));
    if(isManual) pickupToast(isAbort ? '⚠️ サーバーの反応がありません（時間切れ）。もう一度お試しください' : '⚠️ 更新できませんでした。電波を確認してください', true);
    if(!hadCache){
      var msg = isAbort
        ? 'サーバーの反応がありませんでした（時間切れ）。電波の良い場所で、もう一度お試しください。'
        : '通信エラーが発生しました。電波の良い場所でもう一度お試しください。<br><br>'+esc(err.message);
      document.getElementById('content').innerHTML = '<div class="alert-danger">'+msg+'</div><button class="refresh-btn no-print" style="border:1.5px solid #6b7a3a;background:#eef3e0;color:#3b4a1a;font-weight:700;margin-top:10px" onclick="loadOrderList(true)">🔄 もう一度読み込む</button>';
    }
  }
}

/* ★2026-07-25 送り主とお届け先の名前くらべ用。空白（半角・全角）と語尾の「様」を無視して比べる。
   「山本 花子」と「山本花子」を別人と判定しないため。 */
function nameKeyPD(s){
  return String(s||'').replace(/[\s\u3000]/g,'').replace(/様$/,'');
}
function recipientLabel(o){
  if(o.isCompany){
    return [o.companyName, o.positionName, o.personName].filter(Boolean).join(' ') || o.client;
  }
  return o.recipientName || o.client;
}

function renderList(){
  const urgent = allOrders.filter(o=>o.leadType==='urgent').length;
  const gift = allOrders.filter(o=>(o.lines||[]).some(l=>l.giftType==='gift')).length;
  const overdue = allOrders.filter(o=>isOverdue(o)).length;
  let html = '';
  html += '<div class="home-banner no-print"><div class="hb-title">🏠 出荷依頼書 一覧</div><div class="hb-sub">（この画面がホームです）</div></div>';
  // アプリ内の「このアプリは何をする場所？」説明は、別の「倉庫の手引き」ページ(soko-tebiki.html)へ集約したため削除。
  if(overdue){
    html += '<div class="alert-danger no-print">⏰ 出荷期限を過ぎているものが'+overdue+'件あります。優先して確認してください。</div>';
  }
  const globalNote = getGlobalNote();
  if(globalNote){
    html += '<div class="note-box no-print" style="margin-bottom:14px">📌 '+esc(globalNote).replace(/\n/g,'<br>')+'</div>';
  }
  // 集計は「梱包待ち（pending）」だけを数える（完了分は含めない）
  const pendingList = allOrders.filter(function(o){return o.status==='pending';});
  const urgentPending = pendingList.filter(function(o){return o.leadType==='urgent';}).length;
  html += '<div class="watch-metrics no-print">';
  html += '<div class="wm-card wm-urg"><div class="wm-label">急ぎ・未梱包</div><div class="wm-num">'+urgentPending+'<span class="wm-unit"> 件</span></div></div>';
  html += '<div class="wm-card wm-pend"><div class="wm-label">梱包待ち 合計</div><div class="wm-num">'+pendingList.length+'<span class="wm-unit"> 件</span></div></div>';
  html += '</div>';
  html += '<button class="refresh-btn no-print" style="border:1.5px solid #6b7a3a;background:#eef3e0;color:#3b4a1a;font-weight:700" onclick="loadOrderList(true)">🔄 出荷依頼書を更新</button>';
  html += '<details class="tools-box no-print">';
  html += '<summary><span>🧰 その他のボタン（不良品・メモ・在庫）</span><span style="color:#78716c;font-weight:600;white-space:nowrap">タップで開く ▼</span></summary>';
  html += '<div class="tool-grid">';
  html += '<div class="tool-tile" style="background:#fef2f2;border-color:#dc2626" onclick="location.href=\'pickup.html?mode=defect\'"><div class="tt-ic" style="color:#991b1b">🔴</div><div class="tt-tx" style="color:#991b1b">不良品ほうこく</div></div>';
  html += '<div class="tool-tile" style="background:#f1ecfb;border-color:#7c3aed" onclick="location.href=\'pickup.html?mode=notes\'"><div class="tt-ic" style="color:#6d28d9">📝</div><div class="tt-tx" style="color:#5b21b6">メモ</div></div>';
  /* ★2026-08-17 ひろみさん指示で「📦 資材カタログ」のボタンを外しました（二重管理になるため）。
     戻したくなったときの元の行：
     html += '<div class="tool-tile" style="background:#fbeede0;border-color:#b45309" onclick="location.href=\'pickup.html?mode=materials\'"><div class="tt-ic" style="color:#b45309">📦</div><div class="tt-tx" style="color:#7a3a0e">資材カタログ</div></div>'; */
  html += '<div class="tool-tile" style="background:#eef3e0;border-color:#6b7a3a" onclick="location.href=\'pickup.html?mode=stock\'"><div class="tt-ic" style="color:#4a5a1f">🫒</div><div class="tt-tx" style="color:#3b4a1a">在庫を見る</div></div>';
  html += '</div>';
  html += '</details>';
  if(!allOrders.length){
    html += '<div class="card center" style="color:#57534e">現在、届いている出荷依頼書はありません。</div>';
  } else {
    const sorted = allOrders.slice().sort(function(a,b){
      // 梱包待ちを上・梱包終了を下。待ちの中は 期限超過→急ぎ→登録が古い順。終了は完了が新しい順
      const as = a.status==='shipped'?1:0, bs = b.status==='shipped'?1:0;
      if(as!==bs) return as-bs;
      if(as===1){ return String(b.shippedAt||'').localeCompare(String(a.shippedAt||'')); }
      const ao = isOverdue(a)?0:1, bo = isOverdue(b)?0:1;
      if(ao!==bo) return ao-bo;
      const au = a.leadType==='urgent'?0:1, bu = b.leadType==='urgent'?0:1;
      if(au!==bu) return au-bu;
      return (a.registeredAt||'').localeCompare(b.registeredAt||'');
    });
    sorted.forEach(function(o){
      const shipped = (o.status==='shipped');
      const urgentNow = (!shipped && o.leadType==='urgent');
      const overdueNow = isOverdue(o);
      const hasGift = (o.lines||[]).some(l=>l.giftType==='gift');
      const custNote = findCustomerNote(o.client);
      const cardCls = shipped ? 'pk-card pk-done' : (urgentNow ? 'pk-card pk-urg' : 'pk-card');
      const marks = ''
        + (urgentNow?'<span class="wt-mk wt-mk-urg">急ぎ</span>':'')
        + (overdueNow?'<span class="wt-mk wt-mk-over">⏰期限超過</span>':'')
        + (hasNoshi(o)?'<span class="wt-mk">🎀</span>':'')
        + (custNote?'<span class="wt-mk">📝</span>':'')
        + (hasGift?'<span class="wt-mk">🎁</span>':'');
      const wishHtml = o.leadDate ? '<b class="pk-wish-has">'+esc(fmtMD(o.leadDate))+'</b>' : '<b>なし</b>';
      const stat = shipped
        ? '<span class="pk-stat-done">✓ 梱包終了<span class="pk-time">'+esc(shippedTimeShort(o))+'</span></span>'
        : '<span class="pk-stat-wait">🕐 梱包待ち</span>';
      // 一覧カードの本数：箱の分もふくめた「合計の本数」を出す。
      // （以前はバラの本数だけを出していたため、1箱＋2本＝14本の注文が「×2」に見えていた）
      const products = (o.lines||[]).map(function(l){
        const bx = l.boxes||0, bt = l.bottles||0;
        return esc(l.productName)+' ×'+lineTotal(l)+'本'+(bx?'（'+bx+'箱'+(bt?'＋'+bt+'本':'')+'）':'');
      }).join('、');
      html += '<div class="'+cardCls+'" onclick="openOrderInPage(\''+String(o.id).replace(/'/g,"\\'")+'\')">';
      html +=   '<div class="pk-top"><span class="pk-name">'+esc(recipientLabel(o))+'</span>'+stat+'</div>';
      if(marks) html += '<div class="pk-marks">'+marks+'</div>';
      html +=   '<div class="pk-items">'+products+'</div>';
      html +=   '<div class="pk-dates"><span>依頼日 <b>'+esc(fmtMD(o.registeredAt))+'</b></span><span>希望日 '+wishHtml+'</span></div>';
      html += '</div>';
    });
  }
  try{
    if(localStorage.getItem('oos_atelier_ok')==='1' || localStorage.getItem('oos_home_ok')==='1'){
      html += '<div class="admin-back no-print"><a onclick="location.href=\'home.html\'">🏠 管理画面へ戻る</a><div class="ab-note">※ 倉庫さんのスマホには表示されません</div></div>';
    }
  }catch(e){}
  document.getElementById('content').innerHTML = html;
}

async function saveGlobalNoteFromScreen(){
  const text = document.getElementById('note-global').value.trim();
  let n = warehouseNotes.find(x=>x.type==='global');
  if(!n){ n = {id:'note_global', type:'global', key:'', note:'', updatedAt:''}; warehouseNotes.push(n); }
  n.note = text; n.updatedAt = new Date().toISOString();
  await saveWarehouseNotes();
  showToastSimple('✅ 全体用メモを保存しました');
}
async function saveCustomerNoteFromScreen(key){
  const text = document.getElementById('note-cust-text').value.trim();
  if(!key){ alert('お客様名を入力してください'); return; }
  let n = warehouseNotes.find(x=>x.type==='customer' && x.key===key);
  if(!n){ n = {id:'note_'+Date.now(), type:'customer', key:key, note:'', updatedAt:''}; warehouseNotes.push(n); }
  n.note = text; n.updatedAt = new Date().toISOString();
  await saveWarehouseNotes();
  showToastSimple('✅ '+key+'様のメモを保存しました');
  renderNotesScreen(key);
}
async function deleteCustomerNoteFromScreen(key){
  if(!confirm(key+'様のメモを削除しますか？')) return;
  warehouseNotes = warehouseNotes.filter(x=>!(x.type==='customer' && x.key===key));
  await saveWarehouseNotes();
  showToastSimple('削除しました');
  renderNotesScreen('');
}
function showToastSimple(msg){
  let el = document.getElementById('undo-toast');
  if(!el){
    el = document.createElement('div');
    el.id = 'undo-toast';
    el.style.cssText = 'position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#6b7a3a;color:#fff;padding:10px 16px;border-radius:8px;font-size:13px;z-index:9999';
    document.body.appendChild(el);
  }
  el.textContent = msg;
  el.style.display = 'block';
  clearTimeout(el._t);
  el._t = setTimeout(()=>{ el.style.display='none'; }, 2500);
}

function resizeImageFile(file, maxSize){
  return new Promise(function(resolve){
    const reader = new FileReader();
    reader.onload = function(e){
      const img = new Image();
      img.onload = function(){
        let w = img.width, h = img.height;
        if(w>h){ if(w>maxSize){ h = Math.round(h*maxSize/w); w = maxSize; } }
        else { if(h>maxSize){ w = Math.round(w*maxSize/h); h = maxSize; } }
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL('image/jpeg', 0.6));
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  });
}

var _lotInfo = {};   // { pid: {curExp:'…', oldExp:'…', hasOld:true} }
async function loadDefectLots(){
  try{
    const res = await fetch(bust(GAS_URL + '?action=loadAllData&skip=productLabels'), {cache:'no-store'});
    const data = await res.json();
    var lots = (data.status==='ok' && data.data && Array.isArray(data.data.lots)) ? data.data.lots : [];
    var info = {};
    lots.forEach(function(l){
      var pid = parseInt(l.pid); if(!pid) return;
      if(!info[pid]) info[pid] = { curExp:'', oldExp:'', hasOld:false };
      if(l.status==='old'){
        if((parseInt(l.stock)||0) > 0) info[pid].hasOld = true;
        if(l.expiry && !info[pid].oldExp) info[pid].oldExp = l.expiry;
      } else if(l.status==='hold_old' || l.status==='discard_old'){
        if((parseInt(l.stock)||0) > 0) info[pid].hasOld = true;
      } else if(l.status!=='incoming' && l.status!=='discard' && l.status!=='hold'){
        if(l.expiry && !info[pid].curExp) info[pid].curExp = l.expiry;
      }
    });
    _lotInfo = info;
  }catch(e){ _lotInfo = {}; }
  renderDefectLotPick();
}

  var newLv = defectLevelByCode(sel.value);
  var note = (document.getElementById('df-fix-note-'+id)||{}).value || '';
  var oldLv = defectLevelByCode(d.level) || { name:d.level, seal:'' };
  if(!confirm('【'+newLv.seal+'】のシールに貼り替えましたか？\n\n「'+oldLv.name+'」→「'+newLv.name+'」で本部に報告します。\n貼り替えてから「OK」を押してください。')) return;
  // 状態変更の「報告」を1件送る（元データは触らない・本部が反映）。元の報告IDを紐づける。
  var fixReport = {
    id: 'deffix_'+Date.now(), pid: d.pid, productName: d.productName, lotId:'',
    qty: (d.qty||0)-(d.shippedQty||0), cat: newLv.name, level: newLv.code, seal: newLv.seal,
    note: '【状態なおし】'+oldLv.name+'→'+newLv.name+(note?'／'+note:''),
    lotKind: d.lotKind || '',
    status: 'pending', shippedQty: 0, processedAt:'', reportedAt: new Date().toISOString(),
    source: 'warehouse', fixOf: d.id, fixFromLevel: d.level
  };
  var btn = document.querySelector('#df-fix-'+id+' .btn-blue'); if(btn){ btn.disabled=true; btn.textContent='送信中...'; }
  try{
    var appended = false;
    try{
      var apRes = await fetch(GAS_URL, { method:'POST', body: JSON.stringify({ action:'appendDefect', defect: fixReport }), headers:{'Content-Type':'text/plain;charset=utf-8'} });
      var apData = await apRes.json();
      appended = !!(apData && apData.status==='ok' && apData.appended===true);
    }catch(e){ appended = false; }
    if(!appended){
      var res = await fetch(bust(GAS_URL + '?action=loadAllData&skip=productLabels'), {cache:'no-store'});
      var data = await res.json();
      var defs = (data.status==='ok' && data.data && data.data.defects) ? data.data.defects : [];
      defs.push(fixReport);
      var sv = await fetch(GAS_URL, { method:'POST', body: JSON.stringify({ action:'saveAllData', payload:{ defects: defs } }), headers:{'Content-Type':'text/plain;charset=utf-8'} });
      var svd = await sv.json();
      if(svd.status!=='ok'){ alert('送信に失敗しました：'+(svd.message||'')); if(btn){ btn.disabled=false; btn.textContent='この状態で本部に報告する'; } return; }
    }
    try{ sessionStorage.removeItem('oos_pickup_orders_v1'); }catch(e){}
    var wrap = document.getElementById('df-fix-'+id);
    if(wrap) wrap.innerHTML = '<div style="background:#eef7ea;border:1px solid #86c096;border-radius:9px;padding:11px;margin-top:10px;font-size:14px;color:#166534;font-weight:700">✅ 「'+esc(oldLv.name)+'→'+esc(newLv.name)+'」で本部に報告しました</div>';
  }catch(err){
    alert('通信エラーが発生しました：'+err.message);
    if(btn){ btn.disabled=false; btn.textContent='この状態で本部に報告する'; }
  }
}
// 旧・不良品フォーム(renderDefectFormOLD_UNUSED)は未使用のため削除。現行は renderDefectForm を使用。
// ── 黒（廃棄）のときだけ聞く「その瓶は、どこから出しましたか？」（2026-08-13追加）──
// 倉庫さんは瓶を持っているので、貼ってあるシールの色でえらべる。専門用語は使わない。
// 残り本数は出さず、選択も止めない（手元の瓶が現実。食い違いは本部の画面で分かる）。
var DF_SRC = [
  { k:'good', label:'棚から出した',               note:'シールは貼っていなかった（良品として扱っていたもの）' },
  { k:'lv1',  label:'緑のシールが貼ってあった',   note:'不良・軽だったもの' },
  { k:'lv2',  label:'黄のシールが貼ってあった',   note:'不良・中だったもの' },
  { k:'lv3',  label:'赤のシールが貼ってあった',   note:'不良・重だったもの' }
];
function renderDefectSrcPick(){
  var wrap = document.getElementById('df-srcwrap'); if(!wrap) return;
  var sel = document.querySelector('input[name="df-level"]:checked');
  if(!sel || sel.value !== 'discard'){ wrap.innerHTML = ''; return; }
  if(wrap.querySelector('input[name="df-src"]')) return;   // すでに出ていれば作り直さない（選択が消えないように）
  wrap.innerHTML = '<div class="form-group" style="border:2px solid #1a1a18;background:#f7f7f6;border-radius:10px;padding:11px 12px">'
    + '<label style="font-size:13.5px">その瓶は、どこから出しましたか？<span style="color:#dc2626">（えらんでください）</span></label>'
    + '<div style="font-size:12px;color:#57534e;margin:2px 0 8px">貼ってあったシールの色でえらんでください。分からなければ「棚から出した」でOK（本部で直せます）。</div>'
    + DF_SRC.map(function(o){
        return '<label class="df-src-op"><input type="radio" name="df-src" value="'+o.k+'" style="width:auto;margin:2px 0 0" onchange="updateDefectSubmit()">'
          + '<span style="font-size:15px;font-weight:700">'+esc(o.label)+'<small style="display:block;font-size:12px;font-weight:600;color:#6b6459;margin-top:2px">'+esc(o.note)+'</small></span></label>';
      }).join('')
    + '</div>';
}
function updateDefectSubmit(){
  renderDefectSrcPick();
  const sel = document.querySelector('input[name="df-level"]:checked');
  const btn = document.getElementById('df-submit-btn');
  const lotWrap = document.getElementById('df-lot-wrap');
  const needLot = !!(lotWrap && lotWrap.style.display !== 'none');
  const lotSel = document.querySelector('input[name="df-lot"]:checked');
  const needSrc = !!(sel && sel.value==='discard');
  const srcSel = document.querySelector('input[name="df-src"]:checked');
  const qtyEl = document.getElementById('df-qty');
  const qty = qtyEl ? (parseInt(qtyEl.value)||0) : 0;
  if(btn){
    /* ★2026-08-17 ひろみさん指示：ボタンの文字は【いつも「この内容で報告する」】。
       この画面は全部が「報告」なので、ボタンが「えらんでください」だと報告だと思われない。
       足りないものは、ボタンの文字ではなく【ボタンの下】に小さく出す。★戻さないでください。 */
    btn.textContent = 'この内容で報告する';
    var hint = '';
    if(needLot && !lotSel)        { btn.disabled = true;  hint = '▲ どちらのロットかをえらんでください'; }
    else if(!sel)                 { btn.disabled = true;  hint = '▲ 状態をえらんでください'; }
    else if(needSrc && !srcSel)   { btn.disabled = true;  hint = '▲ どこから出したかをえらんでください'; }
    else if(qty<=0)               { btn.disabled = true;  hint = '▲ 本数を入れてください'; }
    else                          { btn.disabled = false; hint = ''; }
    var hintEl = document.getElementById('df-submit-hint');
    if(hintEl) hintEl.textContent = hint;
  }
  document.querySelectorAll('#df-levels .df-lv').forEach(function(el){
    const r = el.querySelector('input[name="df-level"]');
    el.style.boxShadow = (r && r.checked) ? '0 0 0 3px rgba(37,99,235,0.25)' : 'none';
  });
  document.querySelectorAll('#df-lot .df-lot-op').forEach(function(el){
    const r = el.querySelector('input[name="df-lot"]');
    el.style.boxShadow = (r && r.checked) ? '0 0 0 3px rgba(107,122,58,0.30)' : 'none';
  });
  document.querySelectorAll('#df-srcwrap .df-src-op').forEach(function(el){
    const r = el.querySelector('input[name="df-src"]');
    el.style.boxShadow = (r && r.checked) ? '0 0 0 3px rgba(26,26,24,0.30)' : 'none';
  });
}
async function submitDefect(){
  const pid = document.getElementById('df-product').value;
  const qty = parseInt(document.getElementById('df-qty').value)||0;
  const levelSel = document.querySelector('input[name="df-level"]:checked');
  const note = document.getElementById('df-note').value;
  if(!pid || qty<=0){ alert('商品と本数を入力してください'); return; }
  if(!levelSel){ alert('「どのくらいの状態？」をえらんでください'); return; }
  // どちらのロットか（旧ロットが無い商品では質問を出さないので、その場合は現ロット）
  const lotWrap = document.getElementById('df-lot-wrap');
  const needLot = !!(lotWrap && lotWrap.style.display !== 'none');
  const lotSel = document.querySelector('input[name="df-lot"]:checked');
  if(needLot && !lotSel){ alert('「どちらのロットですか？」をえらんでください'); return; }
  const lotKind = needLot ? lotSel.value : 'cur';
  // 黒（廃棄）のときは「どこから出したか」も一緒に送る
  const needSrc = (levelSel.value === 'discard');
  const srcSel = document.querySelector('input[name="df-src"]:checked');
  if(needSrc && !srcSel){ alert('「その瓶は、どこから出しましたか？」をえらんでください'); return; }
  const discardSrc = needSrc ? srcSel.value : '';
  const lv = defectLevelByCode(levelSel.value);
  if(!confirm('【'+lv.seal+'】のシールを貼りましたか？\n\n貼ってから「OK」を押してください。（まだなら「キャンセル」）')) return;
  const p = findProduct(pid);
  const btn = document.getElementById('df-submit-btn');
  btn.disabled = true;
  btn.textContent = '送信中...';

  // 報告する不良品（1件）
  const newDefect = {
    id: 'def_'+Date.now(), pid: p.id, productName: p.name, lotId: '',
    qty: qty, cat: lv.name, level: lv.code, seal: lv.seal, note: note, lotKind: lotKind, discardSrc: discardSrc,
    status: 'pending', shippedQty: 0, processedAt: '', reportedAt: new Date().toISOString(), source: 'warehouse'
  };

  /* ★2026-08-17 ひろみさん指示：
     「報告が終わると『報告ありがとうございました』とお礼のメッセージを出して、
       出荷依頼書一覧に戻るボタンだけ出して。」
     ★「続けて報告する」ボタンは出しません。
     ★「LINEでの重ねてのご連絡は不要です」は書きません（圧に感じさせるため）。
     ★戻さないでください。 */
  function showDone(){
    try{ sessionStorage.removeItem('oos_pickup_orders_v1'); }catch(e){}
    document.getElementById('content').innerHTML =
      '<div class="done-banner">報告ありがとうございました<br><span style="font-size:13px;font-weight:400">'+esc(p.name)+'　'+qty+'本　['+esc(lv.name)+'／'+esc(lv.seal)+'シール]</span></div>'+
      '<div style="background:#f5f8ef;border:1px solid #cdd7b8;border-radius:8px;padding:11px 13px;font-size:13.5px;color:#2b2a26;line-height:1.85;margin-bottom:12px">事務所に届きました。いつもありがとうございます。</div>'+
      '<button class="btn-big btn-print no-print" onclick="location.href=\'pickup.html\'">← 出荷依頼書一覧にもどる</button>';
  }
  function showFail(msg){
    btn.disabled = false; btn.textContent = 'この内容で報告する';
    alert('送信に失敗しました：'+(msg||''));
  }

  // 【従来方式・フォールバック】全件読み→1件足す→全件保存。
  // GAS側にまだ appendDefect が無い場合や、追記に失敗した場合に使う。
  async function fallbackSaveWhole(){
    const res = await fetch(bust(GAS_URL + '?action=loadAllData&skip=productLabels'), {cache:'no-store'});
    const data = await res.json();
    const defects = (data.status==='ok' && data.data && data.data.defects) ? data.data.defects : [];
    defects.push(newDefect);
    const saveRes = await fetch(GAS_URL, {
      method: 'POST',
      body: JSON.stringify({ action:'saveAllData', payload:{ defects: defects } }),
      headers: {'Content-Type':'text/plain;charset=utf-8'}
    });
    const saveData = await saveRes.json();
    if(saveData.status==='ok'){ showDone(); } else { showFail(saveData.message); }
  }

  try{
    // 【新方式】GASに「不良を1件だけ追記する専用の窓口」があれば、そちらを使う。
    // GAS側で順番待ち（LockService）にして1行だけ足すので、2人同時に報告しても消えない。
    // 窓口がまだ無い／未対応なら、appended:true が返らないので従来方式へ自動で切り替える。
    let appended = false;
    try{
      const apRes = await fetch(GAS_URL, {
        method: 'POST',
        body: JSON.stringify({ action:'appendDefect', defect: newDefect }),
        headers: {'Content-Type':'text/plain;charset=utf-8'}
      });
      const apData = await apRes.json();
      appended = !!(apData && apData.status==='ok' && apData.appended===true);
    }catch(e){ appended = false; }

    if(appended){ showDone(); }
    else { await fallbackSaveWhole(); }   // 窓口が無い間も、従来どおり報告できる
  }catch(err){
    btn.disabled = false; btn.textContent = 'この内容で報告する';
    alert('通信エラーが発生しました：'+err.message);
  }
}

async function mergeSaveTracking(val){
  if(!currentOrder) return false;
  const res = await fetch(bust(GAS_URL + '?action=loadAll'), {cache:'no-store'});
  const data = await res.json();
  if(data.status!=='ok' || !data.data || !Array.isArray(data.data.orders)) return false;
  const allOrders = data.data.orders;
  const target = allOrders.find(o=>o.id===currentOrder.id);
  if(!target) return false;
  target.trackingNo = val;
  const saveRes = await fetch(GAS_URL, { method:'POST', body: JSON.stringify({ action:'saveOrders', orders: allOrders }), headers:{'Content-Type':'text/plain;charset=utf-8'} });
  const saveData = await saveRes.json();
  if(saveData.status==='ok'){ currentOrder.trackingNo = val; return true; }
  return false;
}
async function saveTracking(){
  if(!currentOrder) return;
  const el=document.getElementById('tracking-input'); const val=el?String(el.value||'').trim():'';
  try{
    const ok=await mergeSaveTracking(val);
    if(!ok){ alert('保存に失敗しました'); return; }
    // バサラの注文で番号が入ったら、バサラへ「発送のご連絡」を自動送信（office@ にも控え）
    if(val && isBasaraOrder(currentOrder)){
      showToastSimple('✅ 送り状No.を保存しました。バサラへ発送連絡を送っています…');
      try{
        const res = await fetch(GAS_URL, { method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'},
          body: JSON.stringify({ action:'basaraShipNotify', payload:{ orderId: currentOrder.id, orderNo: basaraOrderNoOf(currentOrder), trackingNo: val, client: recipientLabel(currentOrder) } }) });
        const d = await res.json();
        if(d && d.status==='ok' && d.sent){ showToastSimple('📧 バサラへ発送のご連絡を送りました（office@ にも控え）'); currentOrder.basaraShipNotified = true; }
        else if(d && d.status==='ok' && !d.sent && d.reason==='already'){ showToastSimple('（このバサラ注文は送信済みでした）'); }
        else if(d && d.status==='error'){ alert('発送連絡メールの送信に失敗しました：'+(d.message||'')+'\n送り状No.は保存されています。もう一度「保存」を押すと再送します。'); }
      }catch(e){ alert('発送連絡メールの送信で通信エラー：'+e.message+'\n送り状No.は保存されています。もう一度「保存」を押すと再送します。'); }
    } else {
      showToastSimple(val?'✅ 送り状No.を保存しました':'送り状No.を空にしました');
    }
  }
  catch(err){ alert('通信エラーが発生しました：'+err.message); }
}
async function saveShipNote(){
  if(!currentOrder) return;
  const val = document.getElementById('ship-note-input').value;
  try{
    const res = await fetch(bust(GAS_URL + '?action=loadAll'), {cache:'no-store'});
    const data = await res.json();
    if(data.status!=='ok' || !data.data || !Array.isArray(data.data.orders)) return;
    const allOrders = data.data.orders;
    const target = allOrders.find(o=>o.id===currentOrder.id);
    if(!target){ alert('受注が見つかりませんでした'); return; }
    target.shipNote = val;
    const saveRes = await fetch(GAS_URL, {
      method:'POST',
      body: JSON.stringify({ action:'saveOrders', orders: allOrders }),
      headers: {'Content-Type':'text/plain;charset=utf-8'}
    });
    const saveData = await saveRes.json();
    if(saveData.status==='ok'){
      currentOrder.shipNote = val;
      renderOrder();
    } else {
      alert('保存に失敗しました');
    }
  }catch(err){
    alert('通信エラーが発生しました：'+err.message);
  }
}

function updateCompleteBtn(){
  const boxes = document.querySelectorAll('.pack-check');
  const allChecked = Array.from(boxes).every(b=>b.checked);
  const btn = document.getElementById('complete-btn');
  if(btn) btn.disabled = !allChecked;
}

async function completeOrder(){
  if(!currentOrder) return;
  if(hasNoshi(currentOrder) && !noshiPrinted){
    alert('🎀 この注文には熨斗（のし）があります。\n\n先に「熨斗の見本を見て印刷する」から熨斗を印刷してください。印刷が終わると梱包完了できます。');
    return;
  }
  if(!confirm('梱包がすべて完了しましたか？\n「梱包完了」にすると、この注文は出荷待ち一覧から消えます。')) return;
  const _tEl = document.getElementById('tracking-input');
  if(_tEl){ try{ await mergeSaveTracking(String(_tEl.value||'').trim()); }catch(e){} }
  const btn = document.getElementById('complete-btn');
  btn.disabled = true;
  btn.textContent = '処理中...';
  try{
    const res = await fetch(GAS_URL, {
      method: 'POST',
      body: JSON.stringify({ action: 'completePickOrder', orderId: currentOrder.id }),
      headers: {'Content-Type':'text/plain;charset=utf-8'}
    });
    const data = await res.json();
    if(data.status === 'ok'){
      // 在庫は受注A（受注・出荷）が送信時に減らすため、倉庫Dでは在庫をさわらない（梱包完了にするだけ）
      try{ sessionStorage.removeItem('oos_pickup_orders_v1'); }catch(e){}
      document.getElementById('content').innerHTML =
        '<div class="done-banner">✅ 梱包完了として登録しました<br><span style="font-size:13px;font-weight:400">'+esc(currentOrder.num)+'</span></div>'+
        '<button class="btn-big btn-print no-print" onclick="location.href=\'pickup.html\'">← 出荷依頼書一覧にもどる</button>';
    } else {
      btn.disabled = false;
      btn.textContent = '✅ 梱包完了にする';
      alert('処理に失敗しました：'+(data.message||''));
    }
  }catch(err){
    btn.disabled = false;
    btn.textContent = '✅ 梱包完了にする';
    alert('通信エラーが発生しました：'+err.message);
  }
}

initializeProducts();
init();
